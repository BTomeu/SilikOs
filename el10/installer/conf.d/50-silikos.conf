# Anaconda configuration for the SilikOS 10 lab installer (anaconda 40, EL 10): what installer/product's
# etc/anaconda/product.d/silikos.conf says to the EL 9 installer (anaconda 34), in the place anaconda 40 reads.
# Anaconda 40 has no product.d: it takes the profile of the system it runs on (profile.d/almalinux.conf, by the
# os-release of the installer's image: the boot loader directory, the package sources) and then every file of
# /etc/anaconda/conf.d. This is such a file: the base's profile stays as it is. el10/remake_iso.sh puts it in
# images/product.img, with the SilikOS name in /.buildstamp.

[User Interface]
custom_stylesheet = /usr/share/anaconda/pixmaps/silikos.css

[Storage]
# "Automatic" in the Installation Destination screen makes LVM thin volumes (the base's default is plain LVM): the
# same as on SilikOS 9 (docs/ROLLBACK.md). The person still chooses the disk: nothing is selected or erased from here.
default_scheme = LVM_THINP
