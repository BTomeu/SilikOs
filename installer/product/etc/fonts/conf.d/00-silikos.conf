<?xml version="1.0"?>
<!DOCTYPE fontconfig SYSTEM "urn:fontconfig:fonts.dtd">
<!-- SilikOS installer: screens that ask for Cantarell by name (titles, list cells) get the Silik face too -->
<fontconfig>
  <match target="pattern">
    <test qual="any" name="family"><string>Cantarell</string></test>
    <edit name="family" mode="assign" binding="strong"><string>Cascadia Mono</string></edit>
  </match>
</fontconfig>
