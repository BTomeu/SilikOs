# Anaconda configuration file for SilikOS: the base product's settings (boot loader directory, package sources,
# storage defaults) under the SilikOS name.

[Product]
product_name = SilikOS

[Base Product]
product_name = AlmaLinux

[User Interface]
custom_stylesheet = /usr/share/anaconda/pixmaps/silikos.css

[Storage]
# "Automatic" in the Installation Destination screen makes LVM thin volumes (the base's default is plain LVM): / and
# /home in a thin pool, swap a normal volume, part of the volume group left free for the pool to grow. With / on a
# thin volume a snapshot of it is made before each update, and `silik rollback` goes back to it (docs/ROLLBACK.md).
# The person still chooses the disk, and may choose another scheme there: nothing is selected or erased from here.
# (anaconda 34.25: a value of its own anaconda.conf; RHV's and oVirt Node's product files set the same)
default_scheme = LVM_THINP
