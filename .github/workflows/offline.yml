# SilikOS without a network: the offline ISO (tools/build_offline_iso.sh: the installer + a mirror of every package
# the installation takes, made by `silik mirror create`) is built, then installed, unattended, in a virtual machine
# (KVM) that has no network device at all (tests/install/offline.sh: the CI's own run.sh, QEMU started with
# `-nic none`); the installed system boots and checks itself as in the CI. Started by hand only: it downloads
# 2.7 GB of packages and builds a 4 GB ISO. docs/OFFLINE.md.
name: Offline ISO
on:
  workflow_dispatch:
concurrency:
  group: offline-${{ github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  offline:
    runs-on: ubuntu-24.04
    timeout-minutes: 200
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4
        with: { persist-credentials: false }
      - name: KVM for the runner's user
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
          ls -l /dev/kvm
      - name: Tools and disk space
        run: |
          sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/lib/android /opt/hostedtoolcache/CodeQL
          bash tools/ci_apt.sh rpm createrepo-c xorriso mtools cpio isomd5sum qemu-system-x86 qemu-utils imagemagick gnupg
          df -h /
      - name: Unit tests
        run: python3 -m unittest discover -s tests
      - name: Wine and the open EDA tools for the offline ISO too, when their workflows have made them (releases wine-*, eda-tools)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p build/extra
          # get RELEASE PATTERN WHAT: its packages into build/extra. A release that does not exist yet is said (the ISO
          # is then without WHAT); any other failure (the API, a download cut short) stops the job: an ISO quietly
          # missing a release's packages would make a green run of a system without them
          get() {
            if out=$(gh release view "$1" --repo "$GITHUB_REPOSITORY" --json tagName 2>&1); then
              gh release download "$1" --repo "$GITHUB_REPOSITORY" --pattern "$2" --dir build/extra --clobber \
                || { echo "::error title=release $1::the download of its packages failed"; exit 1; }
            elif echo "$out" | grep -qi 'not found'; then
              echo "::notice title=$1::no such release yet: the ISO of this run has no $3"
            else
              echo "::error title=release $1::$out"; exit 1
            fi
          }
          tags=$(gh release list --repo "$GITHUB_REPOSITORY" --limit 50 --json tagName -q '.[].tagName') || { echo "::error title=releases::cannot list them"; exit 1; }
          wine=$(echo "$tags" | grep '^wine-' | head -1 || true)
          if [ -n "$wine" ]; then get "$wine" 'silik-wine-*.rpm' Wine; else echo "::notice title=Wine::no wine-* release yet: the ISO of this run has no Wine"; fi
          get eda-tools '*.rpm' "the open EDA tools"                # (workflow EDA tools)
          get dev-tools '*.rpm' "OpenOCD or dfu-util"               # (workflow Dev tools)
          rm -f build/extra/*.src.rpm      # (the releases' source packages: kept there, not on the ISO)
          rm -f build/extra/*.aarch64.rpm                           # (the ARM builds: the ISO here is x86_64)
          ls -la build/extra
      # in EL 9, with the base's own rpmbuild, dnf, rpmkeys and createrepo_c: our packages, then the mirror of the
      # whole SilikOS set (every package's signature checked on the way in). The releases' packages (build/extra: the
      # network ISO installs them, tools/build_iso.sh) go into the mirror's own repository and into its set: the
      # first offline run had none of them, and the installed system had no OpenOCD, dfu-util or open EDA tools
      - name: Packages and the mirror
        run: |
          docker run --rm -v "$PWD:/src" -w /src almalinux:9 bash -c '
            set -e
            dnf -y -q install rpm-build createrepo_c dnf-plugins-core epel-release gnupg2 > /dev/null
            bash tools/build_rpms.sh
            mkdir -p build/own && cp build/repo/*.rpm build/own/
            add=""
            if ls build/extra/*.rpm > /dev/null 2>&1; then
              cp build/extra/*.rpm build/own/
              for n in $(rpm -qp --qf "%{NAME}\n" build/extra/*.rpm | grep -v -- "-devel\$" | sort -u); do add="$add --add $n"; done
            fi
            echo "the releases packages in the set:${add:- none}"
            python3 packages/silik-tools/files/silik mirror create build/mirror --silikos build/own $add --yes | grep -v "^([0-9]*/[0-9]*): "
            python3 packages/silik-tools/files/silik mirror verify build/mirror'
          sudo chown -R "$(id -u):$(id -g)" build
          du -sh --exclude=.root build/mirror
      - name: The offline ISO
        run: |
          bash tools/build_offline_iso.sh build/mirror
          ls -la build/SilikOS-*-offline.iso
          df -h /
      - name: Install it in a virtual machine without a network device, boot the installed system, check it
        run: bash tests/install/offline.sh build/SilikOS-*-offline.iso build/offline-install-test
      - name: The report
        if: always()
        run: |
          {
            echo '### SilikOS installed from the offline ISO, no network device'
            echo '```'
            cat build/offline-install-test/report.txt 2>/dev/null || echo 'no report: see the installer console (artifact offline-install-test)'
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02  # v4
        if: always()
        with:
          name: offline-install-test
          path: |
            build/offline-install-test/*.log
            build/offline-install-test/*.txt
            build/offline-install-test/*.png
            build/offline-install-test/*.ppm
            build/offline-install-test/ci.ks
            build/SilikOS-*-offline.iso.sha256
