# The open EDA tools of SilikOS: KLayout, Magic, Xschem, ngspice (with XSPICE, and as a shared library), Netgen, Yosys,
# NVC, Qucs-S, DEVSIM and KiCad (with Open CASCADE and nng, which it needs, and its libraries) are not in EL 9's
# repositories or in EPEL 9, so each is built here from upstream's source at the tag of eda/versions (eda/<tool>.spec),
# tried in a clean EL 9 (eda/trial.sh: it must do a small real job) and kept in the release `eda-tools`. The CI's ISO
# takes the packages from that release, so the installed system has them (workflow CI). A recipe that says
# "# release: optional" is kept in the release `eda-optional` instead: not on the ISO.
# KiCad is built after the others, against the packages of ours it uses (the ones of this run).
# Runs when a recipe changes, or by hand. A build is kept (cache) while its recipe (its line of eda/versions, its
# spec, eda/common.inc; for KiCad also those of what it uses) does not change.
name: EDA tools
on:
  push:
    branches: [main]
    paths: ['eda/**', 'tools/build_eda.sh', '.github/workflows/eda.yml']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        tool: [klayout, magic, xschem, ngspice, netgen, yosys, nvc, qucs-s, devsim, opencascade, nng, kicad-symbols, kicad-footprints, kicad-templates]
    runs-on: ubuntu-24.04
    container: almalinux:9
    timeout-minutes: 330
    steps:
      - name: Tools
        run: dnf -y -q install git tar gzip findutils zstd
      - uses: actions/checkout@v4
      - name: The tool's own line of eda/versions (another tool's version does not make this one build again)
        id: line
        shell: bash
        run: echo "sum=$(grep -E '^${{ matrix.tool }}[[:space:]]' eda/versions | sha256sum | cut -c1-16)" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@v4
        id: cache
        with:
          path: build/extra
          key: eda-${{ matrix.tool }}-${{ steps.line.outputs.sum }}-${{ hashFiles('eda/common.inc', format('eda/{0}.spec', matrix.tool)) }}
      - name: Build ${{ matrix.tool }}
        if: steps.cache.outputs.cache-hit != 'true'
        shell: bash
        run: |
          if ! bash tools/build_eda.sh ${{ matrix.tool }} > build.log 2>&1; then
            tail -80 build.log
            echo "::error title=build ${{ matrix.tool }}::$(grep -iE 'error|no such file|not found|cannot|undefined|unpackaged|No match' build.log | tail -10 | tr '\n' ' ' | cut -c1-900)"
            exit 1
          fi
          tail -5 build.log
      - name: What was built
        run: echo "::notice title=${{ matrix.tool }} built::$(cd build/extra && ls -la ${{ matrix.tool }}-*.rpm | awk '{print $5, $9}')"
      - uses: actions/upload-artifact@v4
        with:
          name: eda-${{ matrix.tool }}
          path: build/extra/${{ matrix.tool }}-*.rpm
          compression-level: 0

  # KiCad, against our Open CASCADE, nng and ngspice (the packages of this run; the release's when one was not made)
  kicad:
    needs: build
    if: ${{ !cancelled() }}
    concurrency:            # one build of KiCad at a time: a later run waits, and finds this one's package
      group: eda-kicad
      cancel-in-progress: false
    runs-on: ubuntu-24.04
    container: almalinux:9
    timeout-minutes: 340
    steps:
      - name: Tools
        run: dnf -y -q install git tar gzip findutils zstd
      - uses: actions/checkout@v4
      - name: The lines of eda/versions KiCad is made from
        id: line
        shell: bash
        run: echo "sum=$(grep -E '^(kicad|opencascade|nng|ngspice)[[:space:]]' eda/versions | sha256sum | cut -c1-16)" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@v4
        id: cache
        with:
          path: build/extra
          key: eda-kicad-${{ steps.line.outputs.sum }}-${{ hashFiles('eda/common.inc', 'eda/kicad.spec', 'eda/opencascade.spec', 'eda/nng.spec', 'eda/ngspice.spec') }}
      - uses: actions/download-artifact@v4
        if: steps.cache.outputs.cache-hit != 'true'
        continue-on-error: true
        with: { name: eda-opencascade, path: build/deps }
      - uses: actions/download-artifact@v4
        if: steps.cache.outputs.cache-hit != 'true'
        continue-on-error: true
        with: { name: eda-nng, path: build/deps }
      - uses: actions/download-artifact@v4
        if: steps.cache.outputs.cache-hit != 'true'
        continue-on-error: true
        with: { name: eda-ngspice, path: build/deps }
      - name: Build kicad
        if: steps.cache.outputs.cache-hit != 'true'
        shell: bash
        run: |
          df -h . | tail -1
          if ! bash tools/build_eda.sh kicad > build.log 2>&1; then
            tail -60 build.log
            grep -nE 'FAILED:|error:|Error |CMake Error|Could NOT|not found|No match|unpackaged' build.log | cut -c1-300 | head -150
            echo "::error title=build kicad::$(grep -E 'FAILED:|error:|CMake Error|Could NOT|No match|unpackaged|nothing provides' build.log | sort -u | head -12 | tr '\n' ' ' | cut -c1-1200)"
            exit 1
          fi
          tail -5 build.log; df -h . | tail -1
      - name: What was built
        run: echo "::notice title=kicad built::$(cd build/extra && ls -la kicad-*.rpm | awk '{print $5, $9}')"
      - uses: actions/upload-artifact@v4
        with:
          name: eda-kicad
          path: build/extra/kicad-*.rpm
          compression-level: 0

  trial:
    needs: build
    if: ${{ !cancelled() }}
    strategy:
      fail-fast: false
      matrix:
        tool: [klayout, magic, xschem, ngspice, netgen, yosys, nvc, qucs-s, devsim, opencascade, nng, kicad-symbols, kicad-footprints, kicad-templates]
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: eda-${{ matrix.tool }}
          path: dist
      - name: Try ${{ matrix.tool }} in a clean EL 9, then keep it in the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: bash eda/keep.sh ${{ matrix.tool }}

  kicad-trial:
    needs: kicad
    if: ${{ !cancelled() }}
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with: { name: eda-kicad, path: dist }
      # KiCad runs on our Open CASCADE, nng and ngspice: the packages of this run beside it (eda/keep.sh takes the
      # release's when one was not made in this run), and its symbols and footprints for a real job
      - uses: actions/download-artifact@v4
        continue-on-error: true
        with: { pattern: 'eda-{opencascade,nng,ngspice,kicad-symbols,kicad-footprints,kicad-templates}', path: deps, merge-multiple: true }
      - name: Try kicad in a clean EL 9, then keep it in the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: bash eda/keep.sh kicad
