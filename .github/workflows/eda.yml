# The open EDA tools of SilikOS: KLayout, Magic, Xschem, ngspice (with XSPICE, and as a shared library), Netgen, Yosys,
# NVC, Qucs-S, DEVSIM and KiCad (with Open CASCADE and nng, which it needs, and its libraries) are not in EL 9's
# repositories or in EPEL 9, so each is built here from upstream's source at the tag of eda/versions (eda/<tool>.spec),
# tried in a clean EL 9 (eda/trial.sh: it must do a small real job) and kept in the release `eda-tools`. The CI's ISO
# takes the packages from that release, so the installed system has them (workflow CI). A recipe that says
# "# release: optional" is kept in the release `eda-optional` instead: not on the ISO.
# KiCad is built after the others, against the packages of ours it uses (the ones of this run).
# Runs when a recipe changes, or by hand. A build is kept (cache) while its recipe (its line of eda/versions, its
# spec, eda/common.inc; for KiCad also those of what it uses) does not change. It is kept as soon as it is built, not
# at the end of its job: a later step that fails (an upload GitHub refuses) does not throw hours of building away.
# Each build also makes its source package (tools/build_eda.sh: build/srpm/), kept in the same release as the binary
# (eda/keep.sh); a package that a newer build replaces moves to the release sources-archive with its source.
# ARM (aarch64): the recipes whose ExclusiveArch lists aarch64 are built on GitHub's ARM runners (ubuntu-24.04-arm),
# tried there and kept in a release of their own, `eda-tools-aarch64` (jobs build-arm, keep-arm): the x86_64 jobs and
# the CI's ISO read `eda-tools` by name patterns that do not tell the architectures apart. (Written 12/11/2026 after
# the same build and trial under emulation; not run on GitHub yet: docs/STATUS.md)
name: EDA tools
on:
  push:
    branches: [main]
    paths: ['eda/**', 'tools/build_eda.sh', 'tools/release_keep.sh', '.github/workflows/eda.yml']
  workflow_dispatch:
# read-only by default: the build jobs run upstream's build code (for hours, as root in their container); only the
# jobs that keep a tried package in a release may write, and no checkout keeps the token in .git/config
permissions:
  contents: read
# one run keeps packages at a time (an older run finishing later must not replace a newer package)
concurrency:
  group: eda-tools-release
  cancel-in-progress: false
jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        tool: [klayout, magic, xschem, ngspice, netgen, yosys, nvc, qucs-s, devsim, opencascade, nng, kicad-symbols, kicad-footprints, kicad-templates]
    runs-on: ubuntu-24.04
    container: almalinux:9
    timeout-minutes: 330
    steps:
      - name: Tools
        run: dnf -y -q install git tar gzip findutils zstd
      - uses: actions/checkout@v4
        with: { persist-credentials: false }
      - name: The tool's own line of eda/versions (another tool's version does not make this one build again)
        id: line
        shell: bash
        run: echo "sum=$(grep -E '^${{ matrix.tool }}[[:space:]]' eda/versions | sha256sum | cut -c1-16)" >> "$GITHUB_OUTPUT"
      - uses: actions/cache/restore@v4
        id: cache
        with:
          path: |
            build/extra
            build/srpm
          key: eda-${{ matrix.tool }}-${{ steps.line.outputs.sum }}-${{ hashFiles('eda/common.inc', 'tools/build_eda.sh', format('eda/{0}.spec', matrix.tool)) }}
      - name: Build ${{ matrix.tool }}
        if: steps.cache.outputs.cache-hit != 'true'
        shell: bash
        run: |
          if ! bash tools/build_eda.sh ${{ matrix.tool }} > build.log 2>&1; then
            tail -80 build.log
            echo "::error title=build ${{ matrix.tool }}::$(grep -iE 'error|no such file|not found|cannot|undefined|unpackaged|No match' build.log | tail -10 | tr '\n' ' ' | cut -c1-900)"
            exit 1
          fi
          tail -5 build.log
      - uses: actions/cache/save@v4
        if: steps.cache.outputs.cache-hit != 'true'
        with:
          path: |
            build/extra
            build/srpm
          key: ${{ steps.cache.outputs.cache-primary-key }}
      - name: What was built
        run: echo "::notice title=${{ matrix.tool }} built::$(cd build/extra && ls -la ${{ matrix.tool }}-*.rpm | awk '{print $5, $9}')"
      - uses: actions/upload-artifact@v4
        with:
          name: eda-${{ matrix.tool }}
          path: build/extra/${{ matrix.tool }}-*.rpm
          compression-level: 0
      - uses: actions/upload-artifact@v4
        with:
          name: srpm-eda-${{ matrix.tool }}
          path: build/srpm/${{ matrix.tool }}-[0-9]*.src.rpm
          compression-level: 0

  # KiCad, against our Open CASCADE, nng and ngspice (the packages of this run; the release's when one was not made)
  kicad:
    needs: build
    if: ${{ !cancelled() }}
    concurrency:            # one build of KiCad at a time: a later run waits, and finds this one's package
      group: eda-kicad
      cancel-in-progress: false
    runs-on: ubuntu-24.04
    container: almalinux:9
    timeout-minutes: 340
    steps:
      - name: Tools
        run: dnf -y -q install git tar gzip findutils zstd
      - uses: actions/checkout@v4
        with: { persist-credentials: false }
      - name: The lines of eda/versions KiCad is made from
        id: line
        shell: bash
        run: echo "sum=$(grep -E '^(kicad|opencascade|nng|ngspice)[[:space:]]' eda/versions | sha256sum | cut -c1-16)" >> "$GITHUB_OUTPUT"
      - uses: actions/cache/restore@v4
        id: cache
        with:
          path: |
            build/extra
            build/srpm
          key: eda-kicad-${{ steps.line.outputs.sum }}-${{ hashFiles('eda/common.inc', 'tools/build_eda.sh', 'eda/kicad.spec', 'eda/opencascade.spec', 'eda/nng.spec', 'eda/ngspice.spec') }}
      - uses: actions/download-artifact@v4
        if: steps.cache.outputs.cache-hit != 'true'
        continue-on-error: true
        with: { name: eda-opencascade, path: build/deps }
      - uses: actions/download-artifact@v4
        if: steps.cache.outputs.cache-hit != 'true'
        continue-on-error: true
        with: { name: eda-nng, path: build/deps }
      - uses: actions/download-artifact@v4
        if: steps.cache.outputs.cache-hit != 'true'
        continue-on-error: true
        with: { name: eda-ngspice, path: build/deps }
      - name: Build kicad
        if: steps.cache.outputs.cache-hit != 'true'
        shell: bash
        run: |
          df -h . | tail -1
          if ! bash tools/build_eda.sh kicad > build.log 2>&1; then
            tail -60 build.log
            grep -nE 'FAILED:|error:|Error |CMake Error|Could NOT|not found|No match|unpackaged' build.log | cut -c1-300 | head -150
            echo "::error title=build kicad::$(grep -E 'FAILED:|error:|CMake Error|Could NOT|No match|unpackaged|nothing provides' build.log | sort -u | head -12 | tr '\n' ' ' | cut -c1-1200)"
            exit 1
          fi
          tail -5 build.log; df -h . | tail -1
      - uses: actions/cache/save@v4
        if: steps.cache.outputs.cache-hit != 'true'
        with:
          path: |
            build/extra
            build/srpm
          key: ${{ steps.cache.outputs.cache-primary-key }}
      - name: What was built
        run: echo "::notice title=kicad built::$(cd build/extra && ls -la kicad-*.rpm | awk '{print $5, $9}')"
      - uses: actions/upload-artifact@v4
        with:
          name: eda-kicad
          path: build/extra/kicad-*.rpm
          compression-level: 0
      - uses: actions/upload-artifact@v4
        with:
          name: srpm-eda-kicad
          path: build/srpm/kicad-[0-9]*.src.rpm
          compression-level: 0

  trial:
    needs: build
    permissions:
      contents: write        # (keeps the tried package in the release)
    if: ${{ !cancelled() }}
    strategy:
      fail-fast: false
      matrix:
        tool: [klayout, magic, xschem, ngspice, netgen, yosys, nvc, qucs-s, devsim, opencascade, nng, kicad-symbols, kicad-footprints, kicad-templates]
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with: { persist-credentials: false }
      - uses: actions/download-artifact@v4
        with:
          name: eda-${{ matrix.tool }}
          path: dist
      - uses: actions/download-artifact@v4
        with:
          name: srpm-eda-${{ matrix.tool }}
          path: src
      - name: Try ${{ matrix.tool }} in a clean EL 9, then keep it in the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: bash eda/keep.sh ${{ matrix.tool }}

  kicad-trial:
    needs: kicad
    permissions:
      contents: write        # (keeps the tried package in the release)
    if: ${{ !cancelled() }}
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with: { persist-credentials: false }
      - uses: actions/download-artifact@v4
        with: { name: eda-kicad, path: dist }
      - uses: actions/download-artifact@v4
        with: { name: srpm-eda-kicad, path: src }
      # KiCad runs on our Open CASCADE, nng and ngspice: the packages of this run beside it (eda/keep.sh takes the
      # release's when one was not made in this run), and its symbols and footprints for a real job
      - uses: actions/download-artifact@v4
        continue-on-error: true
        with: { pattern: 'eda-{opencascade,nng,ngspice,kicad-symbols,kicad-footprints,kicad-templates}', path: deps, merge-multiple: true }
      - name: Try kicad in a clean EL 9, then keep it in the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: bash eda/keep.sh kicad

  # KiCad's 3D models: several gigabytes, asked for by nothing. Built and tried in one job, kept in the release
  # eda-optional (the ISO takes eda-tools only)
  models:
    runs-on: ubuntu-24.04
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@v4
        with: { persist-credentials: false }
      - name: The line of eda/versions
        id: line
        run: echo "sum=$(grep -E '^kicad-packages3d[[:space:]]' eda/versions | sha256sum | cut -c1-16)" >> "$GITHUB_OUTPUT"
      - uses: actions/cache/restore@v4
        id: cache
        with:
          path: |
            build/extra
            build/srpm
          key: eda-kicad-packages3d-${{ steps.line.outputs.sum }}-${{ hashFiles('eda/common.inc', 'tools/build_eda.sh', 'eda/kicad-packages3d.spec') }}
      - name: Build kicad-packages3d
        if: steps.cache.outputs.cache-hit != 'true'
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL; df -h . | tail -1
          if ! docker run --rm -v "$PWD:/w" -w /w almalinux:9 bash -c 'dnf -y -q install git tar gzip findutils && bash tools/build_eda.sh kicad-packages3d' > build.log 2>&1; then
            tail -40 build.log; df -h . | tail -1
            echo "::error title=build kicad-packages3d::$(grep -iE 'error|no space|cannot|No match' build.log | tail -8 | tr '\n' ' ' | cut -c1-900)"
            exit 1
          fi
          tail -3 build.log; df -h . | tail -1
          sudo rm -rf build/eda-rpm
      - uses: actions/cache/save@v4
        if: steps.cache.outputs.cache-hit != 'true'
        with:
          path: |
            build/extra
            build/srpm
          key: ${{ steps.cache.outputs.cache-primary-key }}
      - name: What was built
        run: echo "::notice title=kicad-packages3d built::$(cd build/extra && ls -la kicad-packages3d-*.rpm | awk '{print $5, $9}')"
      - uses: actions/upload-artifact@v4
        with:
          name: eda-kicad-packages3d
          path: build/extra/kicad-packages3d-*.rpm
          compression-level: 0
      - uses: actions/upload-artifact@v4
        with:
          name: srpm-eda-kicad-packages3d
          path: build/srpm/kicad-packages3d-[0-9]*.src.rpm
          compression-level: 0

  # tried and kept by a job of its own: the build above ran upstream's build code in a container that could write its
  # workspace (eda/keep.sh included), so the token that writes the release never meets that workspace
  models-keep:
    needs: models
    permissions:
      contents: write        # (keeps the tried package in the release)
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with: { persist-credentials: false }
      - uses: actions/download-artifact@v4
        with: { name: eda-kicad-packages3d, path: dist }
      - uses: actions/download-artifact@v4
        with: { name: srpm-eda-kicad-packages3d, path: src }
      - name: Try it in a clean EL 9, then keep it in the release eda-optional
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL; df -h . | tail -1
          bash eda/keep.sh kicad-packages3d

  # ARM: built in an almalinux:9 container of the ARM runner, read-only token (upstream's build code runs there)
  build-arm:
    strategy:
      fail-fast: false
      matrix:
        tool: [ngspice, netgen, xschem, magic, nng]
    runs-on: ubuntu-24.04-arm
    container: almalinux:9
    timeout-minutes: 330
    steps:
      - name: Tools
        run: dnf -y -q install git tar gzip findutils zstd
      - uses: actions/checkout@v4
        with: { persist-credentials: false }
      - name: Build ${{ matrix.tool }} (aarch64)
        shell: bash
        run: |
          uname -m
          if ! bash tools/build_eda.sh ${{ matrix.tool }} > build.log 2>&1; then
            tail -80 build.log
            echo "::error title=build ${{ matrix.tool }} aarch64::$(grep -iE 'error|no such file|not found|cannot|undefined|unpackaged|No match' build.log | tail -10 | tr '\n' ' ' | cut -c1-900)"
            exit 1
          fi
          tail -5 build.log
      - uses: actions/upload-artifact@v4
        with:
          name: edaarm-${{ matrix.tool }}
          path: build/extra/${{ matrix.tool }}-*.rpm
          compression-level: 0
      - uses: actions/upload-artifact@v4
        with:
          name: srpm-edaarm-${{ matrix.tool }}
          path: build/srpm/${{ matrix.tool }}-*.src.rpm
          compression-level: 0

  # tried in a clean EL 9 aarch64, then kept: the job with the token that writes never meets the build's workspace
  keep-arm:
    needs: build-arm
    permissions:
      contents: write        # (keeps the tried package in the release eda-tools-aarch64)
    if: ${{ !cancelled() }}
    strategy:
      fail-fast: false
      matrix:
        tool: [ngspice, netgen, xschem, magic, nng]
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with: { persist-credentials: false }
      - uses: actions/download-artifact@v4
        with:
          name: edaarm-${{ matrix.tool }}
          path: dist
      - uses: actions/download-artifact@v4
        with:
          name: srpm-edaarm-${{ matrix.tool }}
          path: src
      - name: Try ${{ matrix.tool }} in a clean EL 9 aarch64, then keep it in the release eda-tools-aarch64
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          t=${{ matrix.tool }}
          if out=$(docker run --rm -v "$PWD/dist:/dist:ro" -v "$PWD/eda:/eda:ro" almalinux:9 bash -c "uname -m; bash /eda/trial.sh $t /dist/*.rpm" 2>&1); then
            echo "$out" | tail -5
            echo "::notice title=$t on EL 9 aarch64::$(echo "$out" | grep '^TRIAL-OK' | cut -c10-300)"
          else
            echo "$out" | tail -60
            echo "::error title=trial $t aarch64::$(echo "$out" | tail -12 | tr '\n' ' ' | cut -c1-900)"
            exit 1
          fi
          rel=eda-tools-aarch64
          gh release view $rel --repo "$GITHUB_REPOSITORY" > /dev/null 2>&1 || gh release create $rel --repo "$GITHUB_REPOSITORY" \
            --title "Open EDA tools for SilikOS (EL 9, aarch64)" --prerelease \
            --notes "The open EDA tools of eda-tools that build on ARM (aarch64), from the same recipes (eda/*.spec, eda/versions), upstream's unmodified sources, each tried on EL 9 aarch64. Each keeps its own licence (in the package). Not products of or supported by their authors' projects."
          # with its source package; what they replace moves to the release sources-archive (tools/release_keep.sh)
          ls src/$t-[0-9]*.src.rpm > /dev/null || { echo "::error title=keep $t aarch64::no source package"; exit 1; }
          bash tools/release_keep.sh $rel dist/*.rpm src/$t-[0-9]*.src.rpm
