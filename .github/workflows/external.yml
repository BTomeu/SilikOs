# SilikOS on an external disk (docs/DISK.md, docs/PRIMERA-HORA.md): the ISO (the system alone) is built, then
# tests/install/external.sh installs it under UEFI, encrypted, onto a disk on USB with the options of the ISO's own
# entry "on an external disk", beside a disk that stands for the computer's own; the firmware's boot order and that
# disk must come out as they went in. The installed disk is then started on that computer twice, on another one with
# Secure Boot on, and, after the initramfs with every driver is made, on a third where it is on SATA.
# A workflow of its own: it takes half an hour, and the CI's installation test is not held up by it.
name: External disk
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['tests/install/external*', 'tests/install/media.sh', 'tests/install/must-external.txt', 'tests/install/sealed-console.py', 'tests/install/rows.py',
            '.github/workflows/external.yml', 'tools/build_iso.sh', 'kickstart/**', 'packages/silik-tools/files/plugins/disk.py']
concurrency:
  group: external-${{ github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  external:
    runs-on: ubuntu-24.04
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4
        with: { persist-credentials: false }
      - name: KVM for the runner's user
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
          ls -l /dev/kvm
      - name: Tools, the firmware, disk space
        run: |
          sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/lib/android /opt/hostedtoolcache/CodeQL
          bash tools/ci_apt.sh rpm createrepo-c xorriso mtools cpio isomd5sum qemu-system-x86 qemu-utils ovmf
          ls -l /usr/share/OVMF/
          df -h /
      - name: Packages
        # (built in an EL 9 container, with the base's own rpmbuild, as the CI's packages job does)
        run: |
          docker run --rm -v "$PWD:/src" -w /src almalinux:9 bash -c 'dnf -y -q install rpm-build createrepo_c > /dev/null && bash tools/build_rpms.sh'
          sudo chown -R "$(id -u):$(id -g)" build
      - name: The ISO (the system alone)
        run: |
          createrepo_c --quiet build/repo && ls build/repo
          bash tools/build_iso.sh
      - name: Installed onto a USB disk beside the computer's own; started there, on another computer, and on SATA
        run: bash tests/install/external.sh build/SilikOS-*-netinstall.iso build/external-test
      - name: The report
        if: always()
        run: |
          {
            echo '### SilikOS on an external disk (docs/DISK.md)'
            echo '```'
            cat build/external-test/report.txt 2>/dev/null || echo 'no report: see the consoles (artifact external-test)'
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02  # v4
        if: always()
        with:
          name: external-test
          path: |
            build/external-test/*.log
            build/external-test/*.txt
            build/external-test/*.ks

  # The whole desktop on the USB disk (tests/install/external.sh, SILIK_CI_EXTERNAL_MODE=desktop): the installation the
  # owner does, with the shipped package set, encrypted; then the graphical start: the passphrase is typed on the
  # keyboard at the boot splash (SilikOS's theme), and the installed system says what came up (the theme and its
  # dialog pictures in the initramfs, the login screen, USBGuard and the disk it is on).
  desktop:
    runs-on: ubuntu-24.04
    timeout-minutes: 170
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4
        with: { persist-credentials: false }
      - name: KVM for the runner's user
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
          ls -l /dev/kvm
      - name: Tools, the firmware, disk space
        run: |
          sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/lib/android /opt/hostedtoolcache/CodeQL
          bash tools/ci_apt.sh rpm createrepo-c xorriso mtools cpio isomd5sum qemu-system-x86 qemu-utils ovmf imagemagick tesseract-ocr
          df -h /
      - name: Packages
        run: |
          docker run --rm -v "$PWD:/src" -w /src almalinux:9 bash -c 'dnf -y -q install rpm-build createrepo_c > /dev/null && bash tools/build_rpms.sh'
          sudo chown -R "$(id -u):$(id -g)" build
      - name: The ISO (the system alone)
        run: |
          createrepo_c --quiet build/repo && ls build/repo
          bash tools/build_iso.sh
      - name: The whole desktop installed onto the USB disk, encrypted; the graphical start, the passphrase at the splash
        env:
          SILIK_CI_EXTERNAL_MODE: desktop
        run: bash tests/install/external.sh build/SilikOS-*-netinstall.iso build/external-desktop-test
      - name: The report
        if: always()
        run: |
          {
            echo '### The SilikOS desktop on an external disk'
            echo '```'
            cat build/external-desktop-test/report.txt 2>/dev/null || echo 'no report: see the consoles (artifact external-desktop-test)'
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02  # v4
        if: always()
        with:
          name: external-desktop-test
          path: |
            build/external-desktop-test/*.log
            build/external-desktop-test/*.txt
            build/external-desktop-test/*.ks
            build/external-desktop-test/*.png


  # The graphical start alone, in minutes (SILIK_CI_EXTERNAL_MODE=splash): the small set with the boot splash and
  # SilikOS's theme on the USB disk, encrypted; the passphrase typed at the splash; every screen in the log.
  splash:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4
        with: { persist-credentials: false }
      - name: KVM for the runner's user
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
          ls -l /dev/kvm
      - name: Tools, the firmware, disk space
        run: |
          sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/lib/android /opt/hostedtoolcache/CodeQL
          bash tools/ci_apt.sh rpm createrepo-c xorriso mtools cpio isomd5sum qemu-system-x86 qemu-utils ovmf imagemagick tesseract-ocr
          df -h /
      - name: Packages
        run: |
          docker run --rm -v "$PWD:/src" -w /src almalinux:9 bash -c 'dnf -y -q install rpm-build createrepo_c > /dev/null && bash tools/build_rpms.sh'
          sudo chown -R "$(id -u):$(id -g)" build
      - name: The ISO (the system alone)
        run: |
          createrepo_c --quiet build/repo && ls build/repo
          bash tools/build_iso.sh
      - name: The small set with the boot splash on the USB disk, encrypted; the graphical start, the passphrase at the splash
        env:
          SILIK_CI_EXTERNAL_MODE: splash
          # (the splash program also writes what it does to the serial port: its log is what told, 14/11/2026, why the
          # screen had stayed black)
          SILIK_CI_EXTERNAL_DEBUG: 1
        run: bash tests/install/external.sh build/SilikOS-*-netinstall.iso build/external-splash-test
      - name: The report
        if: always()
        run: |
          {
            echo '### The graphical start from an external disk (the boot splash)'
            echo '```'
            cat build/external-splash-test/report.txt 2>/dev/null || echo 'no report: see the consoles (artifact external-desktop-test)'
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02  # v4
        if: always()
        with:
          name: external-splash-test
          path: |
            build/external-splash-test/*.log
            build/external-splash-test/*.txt
            build/external-splash-test/*.ks
            build/external-splash-test/*.png


  # The ISO as a person starts it (tests/install/media.sh): the one disk of a USB controller, UEFI firmware with
  # Secure Boot on, its own signed boot loader and its own menu; the entry for an external disk is chosen with the
  # keyboard and must start the installer. The screen is read (a picture, then OCR), and the machine's memory is
  # searched for the kernel's command line. The other tests give the installer's kernel to QEMU directly.
  medium:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4
        with: { persist-credentials: false }
      - name: KVM for the runner's user
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
          ls -l /dev/kvm
      - name: Tools, the firmware, disk space
        run: |
          sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/lib/android /opt/hostedtoolcache/CodeQL
          bash tools/ci_apt.sh rpm createrepo-c xorriso mtools cpio isomd5sum qemu-system-x86 qemu-utils ovmf imagemagick tesseract-ocr
          df -h /
      - name: Packages
        run: |
          docker run --rm -v "$PWD:/src" -w /src almalinux:9 bash -c 'dnf -y -q install rpm-build createrepo_c > /dev/null && bash tools/build_rpms.sh'
          sudo chown -R "$(id -u):$(id -g)" build
      - name: The ISO (the system alone)
        run: |
          createrepo_c --quiet build/repo && ls build/repo
          bash tools/build_iso.sh
      - name: The ISO as a USB stick, Secure Boot on; its menu; the entry for an external disk starts the installer
        run: bash tests/install/media.sh build/SilikOS-*-netinstall.iso build/media-test
      - name: The report
        if: always()
        run: |
          {
            echo '### The SilikOS ISO started as a USB stick, Secure Boot on'
            echo '```'
            cat build/media-test/report.txt 2>/dev/null || echo 'no report'
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02  # v4
        if: always()
        with:
          name: media-test
          path: |
            build/media-test/*.log
            build/media-test/*.txt
            build/media-test/*.png
