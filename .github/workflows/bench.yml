# Bench: measurements that decide how a tool is built. Now: ngspice with four sets of compiler flags
# (tools/bench_ngspice_flags.sh), timed on the two circuits of docs/EDA.md. Its notices are the result; nothing is
# built for the system here. Runs when the script changes, or by hand.
name: Bench
on:
  push:
    branches: [main]
    paths: ['tools/bench_ngspice_flags.sh', '.github/workflows/bench.yml']
  workflow_dispatch:
# read-only (the job runs upstream's build code)
permissions:
  contents: read
jobs:
  ngspice-flags:
    runs-on: ubuntu-24.04
    container: almalinux:9
    timeout-minutes: 90
    steps:
      - name: Tools
        run: dnf -y -q install git tar gzip findutils
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4
        with: { persist-credentials: false }
      - name: ngspice built with four sets of flags, each timed
        shell: bash
        run: bash tools/bench_ngspice_flags.sh
