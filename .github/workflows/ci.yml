# SilikOS CI: on every change, the unit tests and the packages; then the real thing: the ISO is built and installed,
# unattended, in a virtual machine (KVM), the installed system boots, checks itself and its screen is saved
# (tests/install/run.sh). The report and the pictures of the last run on main are kept on the branch `ci-results`.
# On a tag v*, the ISO and the packages are attached to a release.
name: CI
on:
  push:
    branches: [main]
    tags: ['v*']
    paths-ignore: ['docs/**', 'README.md', 'wine/**', 'tools/build_wine.sh', 'tools/build_wine_addons.sh', '.github/workflows/wine.yml', 'eda/**', 'tools/build_eda.sh', '.github/workflows/eda.yml', 'tools/bench_ngspice_flags.sh', '.github/workflows/bench.yml', 'dev/**', 'tools/build_dev.sh', '.github/workflows/dev.yml']   # the documents, and the other workflows' own recipes: their packages reach the ISO through their releases, so this runs when those workflows end (below)
  pull_request:
  workflow_dispatch:
  # the ISO takes the packages of the releases wine-*, eda-tools and dev-tools: a run of the workflow that keeps them
  # is followed by an installation test of what it kept
  workflow_run:
    workflows: ['Wine', 'EDA tools', 'Dev tools']
    types: [completed]
    branches: [main]
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
# read-only by default; the installation test writes the branch ci-results, a tag's release job the release
permissions:
  contents: read
jobs:
  packages:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with: { persist-credentials: false }
      - name: Unit tests
        run: python3 -m unittest discover -s tests -v
      - name: Packages
        # (built in an EL 9 container, with the base's own rpmbuild: nothing of the runner's package servers is needed)
        run: docker run --rm -v "$PWD:/src" -w /src almalinux:9 bash -c 'dnf -y -q install rpm-build createrepo_c > /dev/null && bash tools/build_rpms.sh'
      - uses: actions/upload-artifact@v4
        with:
          name: silikos-packages
          path: build/repo/*.rpm

  install:
    needs: packages
    runs-on: ubuntu-24.04
    permissions:
      contents: write        # (the branch ci-results)
    timeout-minutes: 170
    steps:
      - uses: actions/checkout@v4
        with: { persist-credentials: false }
      - name: KVM for the runner's user
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
          ls -l /dev/kvm
      - name: Tools and disk space
        run: |
          sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/lib/android /opt/hostedtoolcache/CodeQL
          bash tools/ci_apt.sh rpm createrepo-c xorriso mtools cpio qemu-system-x86 qemu-utils imagemagick gcc-mingw-w64-x86-64 gcc-mingw-w64-i686 wixl
          df -h /
      - name: Wine and the open EDA tools for the ISO, when their workflows have made them (releases wine-*, eda-tools)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p build/extra
          # get RELEASE PATTERN WHAT: its packages into build/extra. A release that does not exist yet is said (the ISO
          # is then without WHAT); any other failure (the API, a download cut short) stops the job: an ISO quietly
          # missing a release's packages would make a green run of a system without them
          get() {
            if out=$(gh release view "$1" --repo "$GITHUB_REPOSITORY" --json tagName 2>&1); then
              gh release download "$1" --repo "$GITHUB_REPOSITORY" --pattern "$2" --dir build/extra --clobber \
                || { echo "::error title=release $1::the download of its packages failed"; exit 1; }
            elif echo "$out" | grep -qi 'not found'; then
              echo "::notice title=$1::no such release yet: the ISO of this run has no $3"
            else
              echo "::error title=release $1::$out"; exit 1
            fi
          }
          tags=$(gh release list --repo "$GITHUB_REPOSITORY" --limit 50 --json tagName -q '.[].tagName') || { echo "::error title=releases::cannot list them"; exit 1; }
          wine=$(echo "$tags" | grep '^wine-' | head -1 || true)
          if [ -n "$wine" ]; then get "$wine" 'silik-wine-*.rpm' Wine; else echo "::notice title=Wine::no wine-* release yet: the ISO of this run has no Wine"; fi
          get eda-tools '*.rpm' "the open EDA tools"                # (workflow EDA tools)
          get dev-tools '*.rpm' "OpenOCD or dfu-util"               # (workflow Dev tools)
          ls -la build/extra
      # our packages as the packages job built them (in EL 9, with the base's rpmbuild): the ISO carries those
      - uses: actions/download-artifact@v4
        with: { name: silikos-packages, path: build/repo }
      - name: Packages and ISO
        run: |
          createrepo_c --quiet build/repo && ls build/repo
          bash tools/build_iso.sh
      - name: Install the ISO in a virtual machine, boot the installed system, check it
        run: bash tests/install/run.sh build/SilikOS-*-netinstall.iso build/install-test
      - name: The report
        if: always()
        run: |
          {
            echo '### SilikOS installed and booted'
            echo '```'
            cat build/install-test/report.txt 2>/dev/null || echo 'no report: see the installer console (artifact install-test)'
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: install-test
          path: |
            build/install-test/*.log
            build/install-test/*.txt
            build/install-test/*.png
            build/install-test/*.ppm
            build/install-test/ci.ks
      - name: Keep the last report and pictures of main on the branch ci-results
        if: ${{ !cancelled() && github.ref == 'refs/heads/main' }}   # (a run cancelled by a newer one keeps the last report)
        run: |
          d=$(mktemp -d)
          cp build/install-test/report.txt build/install-test/*.png "$d/" 2>/dev/null || true
          tr -d '\r' < build/install-test/install.log 2>/dev/null | tail -120 > "$d/install-console-tail.txt" || true
          printf '# SilikOS: the last unattended installation on main\n\nCommit %s, run %s.\n\n`report.txt`: what the installed system reported on its first boot. `desktop.png`, `start.png`, `command.png`, `windows-program.png`, `windows-installed.png`, `eda-*.png`, `look-*.png` (the bar and island looks chosen from the COMMAND bar, Start in each, the bar look after its lock screen, the Silik look again), `idle-lock.png` (when the session had locked itself during the checks), `lock.png`, `unlock.png`, `unlocked.png`, `logout.png`, `login.png`, `login-prompt.png`: its screen (the desktop, Start after the Super key, the COMMAND bar after Super+Space, a Windows program and the open EDA tools opened from the COMMAND bar, the lock screen and its password prompt, the session after the password, the question before logging out, the login screen and its password prompt).\n' "$GITHUB_SHA" "$GITHUB_RUN_ID" > "$d/README.md"
          cd "$d"
          git init -q -b ci-results
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -q -m "Installation test of $GITHUB_SHA"
          git push -q -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" ci-results
      - uses: actions/upload-artifact@v4
        if: startsWith(github.ref, 'refs/tags/v')
        with:
          name: silikos-iso
          path: build/SilikOS-*-netinstall.iso
          compression-level: 0

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: install
    runs-on: ubuntu-24.04
    permissions:
      contents: write        # (the release)
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Release with the ISO and the packages
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          ls -la dist
          gh release create "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --title "SilikOS $GITHUB_REF_NAME" \
            --notes "The ISO installs the system from the base's own package sources (network). What has and has not been run: docs/STATUS.md; the installation test of this tag: branch ci-results." \
            dist/SilikOS-*-netinstall.iso dist/*.rpm
