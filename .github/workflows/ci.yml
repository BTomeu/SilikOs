# SilikOS CI: on every change, the unit tests and the packages; then the real thing: the ISO is built and installed,
# unattended, in a virtual machine (KVM), the installed system boots, checks itself and its screen is saved
# (tests/install/run.sh). The report and the pictures of the last run on main are kept on the branch `ci-results`.
# On a tag v*, the ISO, the packages and their source packages are attached to a release.
name: CI
on:
  push:
    branches: [main]
    tags: ['v*']
    paths-ignore: ['docs/**', 'README.md', 'wine/**', 'tools/build_wine.sh', 'tools/build_wine_addons.sh', '.github/workflows/wine.yml', 'eda/**', 'tools/build_eda.sh', '.github/workflows/eda.yml', 'tools/bench_ngspice_flags.sh', '.github/workflows/bench.yml', 'dev/**', 'tools/build_dev.sh', '.github/workflows/dev.yml']   # the documents, and the other workflows' own recipes: their packages reach the ISO through their releases, so this runs when those workflows end (below)
  pull_request:
  workflow_dispatch:
  # the ISO takes the packages of the releases wine-*, eda-tools and dev-tools: a run of the workflow that keeps them
  # is followed by an installation test of what it kept
  workflow_run:
    workflows: ['Wine', 'EDA tools', 'Dev tools']
    types: [completed]
    branches: [main]
# one run at a time, and a run in progress is never cancelled: the next one waits for it, and of several waiting only
# the newest runs (GitHub keeps one pending run per group). (13/11/2026: the first installation test of the public
# repository was cancelled 25 minutes in when Dev tools ended, and the next by a push: with several pushes an hour and
# EDA tools running for hours, no installation test would ever finish)
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: false
# read-only by default; the job results writes the branch ci-results, a tag's release job the release and its
# attestation (id-token, attestations: that job's alone, never a job a pull request starts)
permissions:
  contents: read
jobs:
  packages:
    # (a run started by another workflow's end is taken only when that workflow ran for this repository's own main:
    # a pull request from a fork whose branch is called main would otherwise start hours of work here. The audit of 13/11/2026)
    if: ${{ github.event_name != 'workflow_run' || (github.event.workflow_run.event != 'pull_request' && github.event.workflow_run.head_repository.full_name == github.repository) }}
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4
        with: { persist-credentials: false }
      - name: Unit tests
        run: python3 -m unittest discover -s tests -v
      - name: Packages
        # (built in an EL 9 container, with the base's own rpmbuild: nothing of the runner's package servers is needed)
        run: docker run --rm -v "$PWD:/src" -w /src almalinux:9 bash -c 'dnf -y -q install rpm-build createrepo_c > /dev/null && bash tools/build_rpms.sh'
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02  # v4
        with:
          name: silikos-packages
          path: build/repo/*.rpm
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02  # v4
        with:
          name: silikos-sources
          path: build/srpm/*.src.rpm

  # ARM (aarch64), on GitHub's ARM runners: the unit tests, the packages (noarch) built and installed in an aarch64
  # EL 9 with CRB and EPEL as the kickstart has them, `silik` asked what it sees, and the aarch64 ISO built from
  # AlmaLinux's aarch64 boot ISO (UEFI only). Not installed in a virtual machine: no KVM is assumed on these runners [A].
  # (Written 12/11/2026 after the same steps under emulation; not run on GitHub yet: docs/STATUS.md)
  arm:
    # (a run started by another workflow's end is taken only when that workflow ran for this repository's own main:
    # a pull request from a fork whose branch is called main would otherwise start hours of work here. The audit of 13/11/2026)
    if: ${{ github.event_name != 'workflow_run' || (github.event.workflow_run.event != 'pull_request' && github.event.workflow_run.head_repository.full_name == github.repository) }}
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4
        with: { persist-credentials: false }
      - name: Unit tests (aarch64)
        run: uname -m && python3 -m unittest discover -s tests -v
      - name: Packages, installed on EL 9 aarch64
        run: |
          docker run --rm -v "$PWD:/src" -w /src almalinux:9 bash -c '
            set -e; uname -m
            dnf -y -q install rpm-build createrepo_c dnf-plugins-core > /dev/null
            bash tools/build_rpms.sh
            dnf config-manager --set-enabled crb && dnf -y -q install epel-release
            dnf -y -q install --setopt=install_weak_deps=False build/repo/silik-tools-*.rpm build/repo/silik-dev-*.rpm \
              build/repo/silik-eda-open-*.rpm build/repo/silik-win-*.rpm build/repo/silik-command-*.rpm
            for c in "--version" "status --json" "dev tools --json" "eda tools --json" "win apps --json" "hw probe --json"; do silik $c > /dev/null; done
            silik status --json | grep -q "\"arch\": \"aarch64\""
            silik status --json | grep -q "\"vsyscall\": \"n/a\""
            dnf install --assumeno build/repo/*.rpm 2>&1 | grep -E "edk2-aarch64|Install +[0-9]+ Packages|Total download size"'
      - name: The aarch64 ISO
        run: |
          bash tools/ci_apt.sh rpm createrepo-c xorriso mtools cpio isomd5sum
          sudo chown -R "$(id -u):$(id -g)" build      # (build/repo: the packages the step above built in EL 9, as root)
          SILIK_ARCH=aarch64 bash tools/build_iso.sh
          ls -la build/SilikOS-*-aarch64-netinstall.iso
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02  # v4
        if: startsWith(github.ref, 'refs/tags/v')
        with:
          name: silikos-iso-aarch64
          path: build/SilikOS-*-aarch64-netinstall.iso
          compression-level: 0

  install:
    needs: packages
    runs-on: ubuntu-24.04
    timeout-minutes: 170
    permissions:
      contents: read
      attestations: read     # (where a release's package was made, asked before it goes on the ISO)
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4
        with: { persist-credentials: false }
      - name: KVM for the runner's user
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
          ls -l /dev/kvm
      - name: Tools and disk space
        run: |
          sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/lib/android /opt/hostedtoolcache/CodeQL
          bash tools/ci_apt.sh rpm createrepo-c xorriso mtools cpio isomd5sum qemu-system-x86 qemu-utils imagemagick gcc-mingw-w64-x86-64 gcc-mingw-w64-i686 wixl
          df -h /
      - name: Wine and the open EDA tools for the ISO, when their workflows have made them (releases wine-*, eda-tools)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p build/extra
          # get RELEASE PATTERN WHAT WORKFLOW: its packages into build/extra. A release that does not exist yet is said
          # (the ISO is then without WHAT); any other failure (the API, a download cut short) stops the job: an ISO
          # quietly missing a release's packages would make a green run of a system without them.
          # Each package goes on the ISO only with the build provenance attestation of WORKFLOW, the one that keeps
          # that release, on main (tools/vouched.sh). A release is a place anything with a token that writes can put a
          # file, and the installer installs every package of the ISO by its name, as root, without a signature: the
          # package repository asked this before it signs (the audit's S2), the ISO did not (the second pass,
          # 14/11/2026). What nothing vouches for is left out and named; the installation test then says what is missing
          get() {
            if out=$(gh release view "$1" --repo "$GITHUB_REPOSITORY" --json tagName 2>&1); then
              rm -rf build/from; mkdir -p build/from
              gh release download "$1" --repo "$GITHUB_REPOSITORY" --pattern "$2" --dir build/from --clobber \
                || { echo "::error title=release $1::the download of its packages failed"; exit 1; }
              # (the source packages stay in the release; the ARM builds: the ISO here is x86_64)
              rm -f build/from/*.src.rpm build/from/*.aarch64.rpm
              bash tools/vouched.sh --repo "$GITHUB_REPOSITORY" --ref refs/heads/main --workflow "$4" --drop build/from/*.rpm
              for f in build/from/*.rpm; do [ ! -f "$f" ] || mv -n "$f" build/extra/; done
              rm -rf build/from
            elif echo "$out" | grep -qi 'not found'; then
              echo "::notice title=$1::no such release yet: the ISO of this run has no $3"
            else
              echo "::error title=release $1::$out"; exit 1
            fi
          }
          tags=$(gh release list --repo "$GITHUB_REPOSITORY" --limit 50 --json tagName -q '.[].tagName') || { echo "::error title=releases::cannot list them"; exit 1; }
          wine=$(echo "$tags" | grep '^wine-' | head -1 || true)
          if [ -n "$wine" ]; then get "$wine" 'silik-wine-*.rpm' Wine wine.yml; else echo "::notice title=Wine::no wine-* release yet: the ISO of this run has no Wine"; fi
          get eda-tools '*.rpm' "the open EDA tools" eda.yml        # (workflow EDA tools)
          get dev-tools '*.rpm' "OpenOCD or dfu-util" dev.yml       # (workflow Dev tools)
          rm -f build/extra/*.src.rpm      # (the releases' source packages: kept there, not on the ISO)
          rm -f build/extra/*.aarch64.rpm                           # (the ARM builds: the ISO here is x86_64)
          ls -la build/extra
      # our packages as the packages job built them (in EL 9, with the base's rpmbuild): the ISO carries those
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093  # v4
        with: { name: silikos-packages, path: build/repo }
      - name: Packages and ISO
        run: |
          createrepo_c --quiet build/repo && ls build/repo
          bash tools/build_iso.sh
      - name: Install the ISO in a virtual machine, boot the installed system, check it
        run: bash tests/install/run.sh build/SilikOS-*-netinstall.iso build/install-test
      - name: The report
        if: always()
        run: |
          {
            echo '### SilikOS installed and booted'
            echo '```'
            cat build/install-test/report.txt 2>/dev/null || echo 'no report: see the installer console (artifact install-test)'
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
      # the measurement starts of tests/install/run.sh (its step 4, tests/install/bench.sh): `silik bench system` on the
      # installed system, two starts with the speed profile and two after `silik speed undo` (docs/SPEED.md)
      - name: Start and memory of the installed system, with the speed profile and after its undo
        if: always()
        run: |
          {
            echo '### Start and memory: the speed profile (on-1, on-2), then after `silik speed undo` (undo-1, undo-2)'
            echo '```'
            cat build/install-test/bench.txt 2>/dev/null || echo 'no measurement: see the consoles of the measurement starts (artifact install-bench)'
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02  # v4
        if: always()
        with:
          name: install-bench
          if-no-files-found: ignore
          path: |
            build/install-test/bench.txt
            build/install-test/bench-*.json
            build/install-test/bench-*.txt
            build/install-test/bench-start*.log
            build/install-test/bench-start*.out
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02  # v4
        if: always()
        with:
          name: install-test
          path: |
            build/install-test/*.log
            build/install-test/*.txt
            build/install-test/*.png
            build/install-test/*.ppm
            build/install-test/ci.ks
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02  # v4
        if: startsWith(github.ref, 'refs/tags/v')
        with:
          name: silikos-iso
          path: build/SilikOS-*-netinstall.iso
          compression-level: 0

  # the last report and pictures of main, kept on the branch ci-results by a job of its own (written 13/11/2026, not
  # run yet): the token that writes never meets the workspace where the ISO was built and the virtual machine ran,
  # and no job that a pull request starts has it
  results:
    needs: install
    if: ${{ !cancelled() && needs.install.result != 'skipped' && github.ref == 'refs/heads/main' }}   # (a run cancelled by a newer one keeps the last report)
    runs-on: ubuntu-24.04
    permissions:
      contents: write        # (the branch ci-results)
    timeout-minutes: 10
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093  # v4
        continue-on-error: true      # (an installation that left no file: the branch then says so with its commit)
        with: { name: install-test, path: install-test }
      - name: Keep the last report and pictures of main on the branch ci-results
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          d=$(mktemp -d)
          cp install-test/report.txt install-test/*.png "$d/" 2>/dev/null || true
          tr -d '\r' < install-test/install.log 2>/dev/null | tail -120 > "$d/install-console-tail.txt" || true
          printf '# SilikOS: the last unattended installation on main\n\nCommit %s, run %s.\n\n`report.txt`: what the installed system reported on its first boot. `desktop.png`, `start.png`, `command.png`, `windows-program.png`, `windows-installed.png`, `eda-*.png`, `look-*.png` (the Silik, bar and island looks chosen from the COMMAND bar, Start in each, the bar look after its lock screen; the island is the default), `accent-volt-vivid.png`, `accent-volt-vivid-start.png` (the accent volt violet with its title bars, chosen from the COMMAND bar, Start in it), `idle-lock.png` (when the session had locked itself during the checks), `lock.png`, `unlock.png`, `unlocked.png`, `logout.png`, `login.png`, `login-prompt.png`: its screen (the desktop, Start after the Super key, the COMMAND bar after Super+Space, a Windows program and the open EDA tools opened from the COMMAND bar, the lock screen and its password prompt, the session after the password, the question before logging out, the login screen and its password prompt).\n' "$GITHUB_SHA" "$GITHUB_RUN_ID" > "$d/README.md"
          cd "$d"
          git init -q -b ci-results
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -q -m "Installation test of $GITHUB_SHA"
          git push -q -f "https://x-access-token:$GH_TOKEN@github.com/$GITHUB_REPOSITORY.git" ci-results

  # (docs/SIGNING.md) What a release holds is listed by its sha256 (SHA256SUMS) and that list is attested: GitHub
  # signs, with this run's identity (this workflow, this tag, this commit; an OIDC token, no key of ours), the
  # statement that this run made those files. `tools/verify_release.sh DIR` checks a download against both. It says
  # where the files were made, not that the commit is good. The two permissions it needs are this job's only: it runs
  # for a tag v* of this repository, never for a pull request, and has no checkout.
  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [install, arm]
    runs-on: ubuntu-24.04
    permissions:
      contents: write        # (the release)
      id-token: write        # (the run's identity, for the attestation)
      attestations: write    # (the attestation is kept by GitHub, for `gh attestation verify`)
    steps:
      # (the second pass, 14/11/2026) a tag can be put on any commit by whoever can push one, and this job gives what
      # that commit builds a release and this repository's attestation (ci.yml, refs/tags/v...). Only a commit of main
      # gets either: main is not behind it (the package repository asks the same before it publishes a tag's CI run)
      - name: The tag is on a commit of main
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          on_main() { [ "$(gh api "repos/$GITHUB_REPOSITORY/compare/$1...main" -q .behind_by 2> /dev/null)" = 0 ]; }
          echo "$GITHUB_SHA" | grep -Eq '^[0-9a-f]{40}$' && on_main "$GITHUB_SHA" \
            || { echo "::error title=release::this tag is on $GITHUB_SHA, which is not a commit of main: no release, no attestation"; exit 1; }
          echo "the tag $GITHUB_REF_NAME is on $GITHUB_SHA, a commit of main"
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093  # v4
        with:
          path: dist
          merge-multiple: true
      - name: What the release holds, by its sha256
        run: |
          set -euo pipefail
          ls -la dist
          (cd dist && sha256sum SilikOS-*-netinstall.iso *.rpm > SHA256SUMS && cat SHA256SUMS)
      # (before the release exists: a release whose files could not be attested is not made)
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8  # v4
        id: attest
        with:
          subject-checksums: dist/SHA256SUMS
      - name: Release with the ISO and the packages
        env:
          GH_TOKEN: ${{ github.token }}
          BUNDLE: ${{ steps.attest.outputs.bundle-path }}
        run: |
          set -euo pipefail
          # the attestation itself beside the files: `gh attestation verify --bundle` then needs no API of GitHub's
          # (SHA256SUMS is not signed with SilikOS's key: the key is the owner's to make, docs/REPO.md)
          cp "$BUNDLE" dist/SHA256SUMS.attestation.jsonl
          gh release create "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --title "SilikOS $GITHUB_REF_NAME" \
            --notes "The ISO installs the system from the base's own package sources (network). What has and has not been run: docs/STATUS.md; the installation test of this tag: branch ci-results. Checking a download: SHA256SUMS, and where the files were built: tools/verify_release.sh (docs/SIGNING.md). Source packages (*.src.rpm): SilikOS's own here; those of the tools the ISO carries in the releases eda-tools, dev-tools and wine-* (older builds in sources-archive); those of the base's packages in the ISO's installer at vault.almalinux.org (tools/fetch_base_sources.sh lists and fetches them)." \
            dist/SilikOS-*-netinstall.iso dist/*.rpm dist/SHA256SUMS dist/SHA256SUMS.attestation.jsonl

  # The way back from an update (docs/ROLLBACK.md, its test plan's steps 1-6, 8 and 10), in virtual machines with the
  # ISO: an unattended installation whose kickstart names no partitioning scheme (the installer's default on this
  # ISO must be LVM thin), `silik snapshot create`, the prune, a real downgrade and the real update service (its
  # snapshot first), a start from the snapshot's boot entry, `silik rollback` there, the start from the Revert entry
  # with `silik rollback finish` (the default kernel has its modules), the normal start after it; then a second,
  # small installation on plain partitions, where `silik snapshot` says "not available" and `silik rollback
  # --packages` goes back. The ISO is built here from the packages job's packages (the system alone, without the
  # other workflows' releases), beside the installation test, which it does not touch.
  # continue-on-error: this job is new and has never run (written 13/11/2026 where nothing of LVM, KVM or a boot
  # could run): it must not stop the ISO or a release until it has passed. Each step of the plan is an annotation.
  rollback-test:
    needs: packages
    runs-on: ubuntu-24.04
    continue-on-error: true
    timeout-minutes: 170
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4
        with: { persist-credentials: false }
      - name: KVM for the runner's user
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
          ls -l /dev/kvm
      - name: Tools and disk space
        run: |
          sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/lib/android /opt/hostedtoolcache/CodeQL
          bash tools/ci_apt.sh rpm createrepo-c xorriso mtools cpio isomd5sum qemu-system-x86 qemu-utils
          df -h /
      # our packages as the packages job built them (in EL 9, with the base's rpmbuild)
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093  # v4
        with: { name: silikos-packages, path: build/repo }
      - name: The ISO (the system alone)
        run: |
          createrepo_c --quiet build/repo && ls build/repo
          bash tools/build_iso.sh
      - name: Thin layout, snapshot, update, the snapshot's start, rollback, finish; then a disk without LVM thin
        run: bash tests/install/rollback.sh build/SilikOS-*-netinstall.iso build/rollback-test
      - name: The report
        if: always()
        run: |
          {
            echo '### SilikOS rollback test (docs/ROLLBACK.md)'
            echo '```'
            cat build/rollback-test/report.txt 2>/dev/null || echo 'no report: see the consoles (artifact rollback-test)'
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02  # v4
        if: always()
        with:
          name: rollback-test
          path: |
            build/rollback-test/*.log
            build/rollback-test/*.txt
            build/rollback-test/*.ks

  # The hardened level of `silik secure level` on an installed system (tests/install/hardened.sh, docs/HARDENED.md):
  # the level is set, the machine restarts and each item is checked there (the kernel's command line, the lockdown, a
  # module without a signature refused, the kernel settings, the desktop session, silik doctor), then `level default`,
  # another restart, and everything as it was. The machine has no Secure Boot and no encrypted disk: the level must
  # say "hardened, except". A job of its own, beside the installation test, which it does not touch.
  # continue-on-error: this job is new and has never run (written 13/11/2026 where no KVM, no kernel of the base and
  # no boot could run): it must not stop the ISO or a release until it has passed. Each step is an annotation.
  hardened-test:
    needs: packages
    runs-on: ubuntu-24.04
    continue-on-error: true
    timeout-minutes: 170
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4
        with: { persist-credentials: false }
      - name: KVM for the runner's user
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
          ls -l /dev/kvm
      - name: Tools and disk space
        run: |
          sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/lib/android /opt/hostedtoolcache/CodeQL
          bash tools/ci_apt.sh rpm createrepo-c xorriso mtools cpio isomd5sum qemu-system-x86 qemu-utils
          df -h /
      # our packages as the packages job built them (in EL 9, with the base's rpmbuild)
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093  # v4
        with: { name: silikos-packages, path: build/repo }
      - name: The ISO (the system alone)
        run: |
          createrepo_c --quiet build/repo && ls build/repo
          bash tools/build_iso.sh
      - name: The hardened level is set, holds after a restart, and `level default` puts everything back
        run: bash tests/install/hardened.sh build/SilikOS-*-netinstall.iso build/hardened-test
      - name: The report
        if: always()
        run: |
          {
            echo '### SilikOS hardened level test (docs/HARDENED.md)'
            echo '```'
            cat build/hardened-test/report.txt 2>/dev/null || echo 'no report: see the consoles (artifact hardened-test)'
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02  # v4
        if: always()
        with:
          name: hardened-test
          path: |
            build/hardened-test/*.log
            build/hardened-test/*.txt
            build/hardened-test/*.ks


  # Data at rest and the boot chain (docs/DISK.md), in a virtual machine with the ISO: an unattended installation
  # under UEFI whose kickstart says `autopart --encrypted` and names nothing else (what "Encrypt my data" makes on
  # this ISO must be LUKS2 with argon2id), then seven starts of the installed system with the runner's OVMF firmware
  # and a software TPM (swtpm): Secure Boot on and the passphrase typed on the serial console; `silik disk`;
  # `silik disk tpm enroll` with a PIN; the PIN opens the disk; with Secure Boot off, and with another TPM, the PIN
  # does not and the passphrase does; the first machine again; an empty and a wrong PIN; `silik disk tpm remove`;
  # the passphrase again. The ISO is built here from the packages job's packages, as in rollback-test.
  # continue-on-error: this job is new and has never run (written 13/11/2026 where no virtual machine, firmware or
  # TPM could run): it must not stop the ISO or a release until it has passed. Each start is an annotation.
  sealed-test:
    needs: packages
    runs-on: ubuntu-24.04
    continue-on-error: true
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4
        with: { persist-credentials: false }
      - name: KVM for the runner's user
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
          ls -l /dev/kvm
      - name: Tools, the firmware, the software TPM, disk space
        run: |
          sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/lib/android /opt/hostedtoolcache/CodeQL
          bash tools/ci_apt.sh rpm createrepo-c xorriso mtools cpio isomd5sum qemu-system-x86 qemu-utils ovmf swtpm
          ls -l /usr/share/OVMF/
          # Ubuntu confines swtpm to the peers libvirt labels; here QEMU is started by hand. On this throw-away
          # runner the profile is taken out (nothing of SilikOS; the test keeps the TPM's files in /tmp either way)
          if [ -e /etc/apparmor.d/usr.bin.swtpm ]; then
            sudo ln -sf /etc/apparmor.d/usr.bin.swtpm /etc/apparmor.d/disable/ && sudo apparmor_parser -R /etc/apparmor.d/usr.bin.swtpm || echo "the swtpm profile stays"
          fi
          df -h /
      # our packages as the packages job built them (in EL 9, with the base's rpmbuild)
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093  # v4
        with: { name: silikos-packages, path: build/repo }
      - name: The ISO (the system alone)
        run: |
          createrepo_c --quiet build/repo && ls build/repo
          bash tools/build_iso.sh
      - name: An encrypted installation; Secure Boot, a TPM, silik disk; the PIN, and where it must not open the disk
        run: bash tests/install/sealed.sh build/SilikOS-*-netinstall.iso build/sealed-test
      - name: The report
        if: always()
        run: |
          {
            echo '### SilikOS sealed test (docs/DISK.md)'
            echo '```'
            cat build/sealed-test/report.txt 2>/dev/null || echo 'no report: see the consoles (artifact sealed-test)'
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02  # v4
        if: always()
        with:
          name: sealed-test
          path: |
            build/sealed-test/*.log
            build/sealed-test/*.txt
            build/sealed-test/*.ks
