# Wine for SilikOS: upstream's source built on EL 9 as the package silik-wine (wine/silik-wine.spec); Wine Mono and Wine
# Gecko as the packages silik-wine-mono and silik-wine-gecko (wine/silik-wine-addons.spec: .NET programs and HTML
# without a download or a dialog). Tried together in a clean EL 9 with a screen: a prefix is made, a 64-bit and a
# 32-bit Windows program run, a .NET program is compiled and run, the HTML engine loads Gecko. Kept as the release
# `wine-<version>`. The CI's ISO takes the packages from that release (workflow CI), so the installed system has
# Wine and the installation test runs Windows programs in it.
# Each build also makes its source package (build/srpm/: Wine's archive and signature; the add-ons' binary and source
# archives), kept in the same release; a package a newer build replaces moves to the release sources-archive with its
# source (tools/release_keep.sh).
# Runs when a recipe changes, or by hand (Actions > Wine > Run workflow, with a version). The build of Wine takes
# about half an hour and is kept (cache) while its recipe does not change, so a change to the rest is quick.
name: Wine
on:
  push:
    branches: [main]
    paths: ['wine/**', 'tools/build_wine.sh', 'tools/build_wine_addons.sh', 'tools/release_keep.sh', '.github/workflows/wine.yml']
  workflow_dispatch:
    inputs:
      version:
        description: Wine release to build (empty = the one of wine/silik-wine.spec)
        default: ''
# read-only by default: the build jobs run upstream's build code (Wine's configure and make, the add-ons' archives) as
# root in their container; only the release job may write, and no checkout keeps the token in .git/config
permissions:
  contents: read
concurrency:
  group: wine-release
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-24.04
    container: almalinux:9
    timeout-minutes: 300
    outputs:
      version: ${{ steps.ver.outputs.version }}
    steps:
      - name: Tools
        run: dnf -y -q install git tar gzip findutils zstd
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4
        with: { persist-credentials: false }
      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830  # v4
        id: cache
        with:
          path: |
            build/extra
            build/srpm
          key: silik-wine-${{ inputs.version }}-${{ hashFiles('wine/silik-wine.spec', 'wine/sources', 'tools/build_wine.sh') }}
      - name: Build silik-wine
        if: steps.cache.outputs.cache-hit != 'true'
        env:
          V: ${{ inputs.version }}
        # (the version typed by hand reaches the shell as data, and only as a release number)
        run: |
          case "$V" in ''|[0-9]*) ;; *) echo "::error title=version::not a Wine release number: $V"; exit 1;; esac
          case "$V" in *[!0-9.]*) echo "::error title=version::not a Wine release number: $V"; exit 1;; esac
          bash tools/build_wine.sh $V
      - name: Version
        id: ver
        run: |
          ls -la build/extra
          echo "version=$(rpm -qp --qf '%{VERSION}' build/extra/silik-wine-*.rpm)" >> "$GITHUB_OUTPUT"
          echo "::notice title=silik-wine built::$(ls -la build/extra/silik-wine-*.rpm | awk '{print $5, $9}')"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02  # v4
        with:
          name: silik-wine
          path: build/extra/silik-wine-*.rpm
          compression-level: 0
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02  # v4
        with:
          name: srpm-wine
          path: build/srpm/silik-wine-[0-9]*.src.rpm
          compression-level: 0

  addons:
    needs: build
    runs-on: ubuntu-24.04
    container: almalinux:9
    timeout-minutes: 30
    steps:
      - name: Tools
        run: dnf -y -q install git tar gzip xz findutils rpm-build binutils cpio
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4
        with: { persist-credentials: false }
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093  # v4
        with:
          name: silik-wine
          path: dist
      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830  # v4
        id: cache
        with:
          path: |
            build/addons
            build/addons-srpm
          key: silik-wine-addons-${{ needs.build.outputs.version }}-${{ hashFiles('wine/silik-wine-addons.spec', 'wine/sources', 'tools/build_wine_addons.sh') }}
      - name: Build silik-wine-mono and silik-wine-gecko
        if: steps.cache.outputs.cache-hit != 'true'
        shell: bash
        run: |
          if ! bash tools/build_wine_addons.sh dist/silik-wine-*.rpm > build.log 2>&1; then
            tail -40 build.log
            echo "::error title=Wine add-ons::$(tail -8 build.log | tr '\n' ' ' | cut -c1-900)"
            exit 1
          fi
          grep -E '^(this Wine asks|source:)' build.log
          mkdir -p build/addons build/addons-srpm && mv build/extra/silik-wine-mono-*.rpm build/extra/silik-wine-gecko-*.rpm build/addons/
          mv build/srpm/silik-wine-addons-*.src.rpm build/addons-srpm/
      - name: What was built
        run: echo "::notice title=Wine add-ons built::$(cd build/addons && ls -la *.rpm | awk '{print $5, $9}' | tr '\n' ' ')"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02  # v4
        with:
          name: silik-wine-addons
          path: build/addons/*.rpm
          compression-level: 0
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02  # v4
        with:
          name: srpm-wine-addons
          path: build/addons-srpm/*.src.rpm
          compression-level: 0

  trial:
    needs: [build, addons]
    runs-on: ubuntu-24.04
    container: almalinux:9
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4
        with: { persist-credentials: false }
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093  # v4
        with:
          name: silik-wine
          path: dist
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093  # v4
        with:
          name: silik-wine-addons
          path: dist
      - name: Install them; a prefix, two Windows programs (64-bit and 32-bit), a .NET program, the HTML engine
        shell: bash
        run: |
          # each stage reports what it printed when it fails (the annotation of the run)
          stage() { local name=$1; shift; local out
            if out=$("$@" 2>&1); then echo "== $name"; echo "$out" | tail -4
            else echo "$out" | tail -40; echo "::error title=Wine trial - $name::$(echo "$out" | tail -14 | tr '\n' ' ' | cut -c1-900)"; exit 1; fi; }
          # a mirror in the middle of a synchronisation answers 404 for a while: three tries, a minute apart
          again() { for i in 1 2 3; do "$@" && return 0; dnf clean metadata -q; sleep 60; done; return 1; }
          # only the base's repositories and CRB (for the cross compilers): the package needs nothing of EPEL
          stage "repositories" again bash -c 'dnf -y -q install dnf-plugins-core && dnf config-manager --set-enabled crb'
          stage "install the packages" again dnf -y install dist/silik-wine-*.rpm
          stage "the cross compilers and a screen" again dnf -y -q install mingw64-gcc mingw32-gcc xorg-x11-server-Xvfb
          # with a screen, as on a desktop: a Wine that misses Mono opens a dialog here and the set-up never ends
          Xvfb :9 -screen 0 1024x768x24 > /dev/null 2>&1 &
          sleep 2; export DISPLAY=:9
          stage "wine --version" wine --version
          printf '#include <stdio.h>\nint main(void) { puts("hello from a Windows program"); return 0; }\n' > hello.c
          stage "compile 64-bit" x86_64-w64-mingw32-gcc -O2 -o hello64.exe hello.c
          stage "compile 32-bit" i686-w64-mingw32-gcc -O2 -o hello32.exe hello.c
          export WINEPREFIX=/root/prefix HOME=/root
          stage "make the prefix (wineboot)" timeout 600 wineboot --init
          for p in hello64 hello32; do
            stage "run $p.exe" bash -c "timeout 300 wine $p.exe > $p.out 2> $p.err; rc=\$?; cat $p.out; tail -12 $p.err; tr -d '\\r' < $p.out | grep -qx 'hello from a Windows program' || { echo \"exit \$rc, no greeting\"; exit 1; }"
            echo "::notice title=Wine on EL 9::$p.exe ran"
          done
          # .NET: a program compiled with Wine Mono's own compiler, then run
          mcs=$(ls /opt/silik-wine/share/wine/mono/wine-mono-*/lib/mono/4.5/mcs.exe | head -1)
          printf 'using System;\nclass Hello { static int Main() { Console.WriteLine("a .NET program ran: " + Environment.Version); return 0; } }\n' > net.cs
          stage "compile a .NET program" bash -c "timeout 300 wine '$mcs' /out:net.exe net.cs 2>&1 | tail -5; test -s net.exe"
          stage "run the .NET program" bash -c "timeout 300 wine net.exe > net.out 2> net.err; cat net.out; tail -5 net.err; grep -q 'a .NET program ran' net.out"
          echo "::notice title=Wine Mono on EL 9::$(tr -d '\r' < net.out | head -1)"
          # HTML: a program makes an HTML document; Wine's engine must have loaded Gecko's library for it
          stage "compile the HTML trial" x86_64-w64-mingw32-gcc -O2 -o html.exe wine/trial_html.c -lole32 -luuid
          stage "the HTML engine loads Gecko" bash -c "timeout 300 wine html.exe > html.out 2> html.err; rc=\$?; cat html.out; tail -5 html.err; exit \$rc"
          echo "::notice title=Wine Gecko on EL 9::$(tr -d '\r' < html.out | tail -1)"
          wineserver -k || true

  release:
    needs: [build, trial]
    runs-on: ubuntu-24.04
    permissions:
      contents: write        # (the release wine-<version>)
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4          # (tools/release_keep.sh)
        with: { persist-credentials: false }
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093  # v4
        with:
          pattern: srpm-wine*
          path: src
          merge-multiple: true
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093  # v4
        with:
          name: silik-wine
          path: dist
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093  # v4
        with:
          name: silik-wine-addons
          path: dist
      - name: Release wine-${{ needs.build.outputs.version }}
        env:
          GH_TOKEN: ${{ github.token }}
          V: ${{ needs.build.outputs.version }}
        run: |
          tag="wine-$V"
          gh release view "$tag" --repo "$GITHUB_REPOSITORY" > /dev/null 2>&1 || gh release create "$tag" --repo "$GITHUB_REPOSITORY" \
            --title "silik-wine $V" --prerelease \
            --notes "Wine $V (upstream's source, unmodified, LGPL) built on EL 9 for SilikOS: wine/silik-wine.spec. Not a product of or supported by WineHQ."
          # one package of each name in the release, with its source package: an older build of the same package moves
          # to the release sources-archive (after the new one is up), never deleted
          ls src/silik-wine-[0-9]*.src.rpm src/silik-wine-addons-*.src.rpm > /dev/null || { echo "::error title=keep::no source packages"; exit 1; }
          bash tools/release_keep.sh "$tag" dist/silik-wine-*.rpm src/*.src.rpm
          gh release edit "$tag" --repo "$GITHUB_REPOSITORY" --notes "Wine $V (upstream's source, unmodified, LGPL) built on EL 9 for SilikOS (wine/silik-wine.spec), with Wine Mono and Wine Gecko (upstream's binary archives, unmodified; their own licences) as packages of their own (wine/silik-wine-addons.spec). Not a product of or supported by WineHQ."
