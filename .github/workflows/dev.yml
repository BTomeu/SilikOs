# The embedded-development and bench tools of SilikOS: OpenOCD, dfu-util, stm32flash, SavvyCAN, silik-pylab (python-can,
# cantools, esptool, pymodbus), sigrok, SDCC and the fx2lafw firmware (built with that SDCC: job build-uses) are not in
# EL 9's repositories or in EPEL 9 for it, so each
# is built here from upstream's source at the tag of dev/versions (dev/<tool>.spec), tried in a clean EL 9
# (dev/trial.sh) and kept in the release `dev-tools`. Then the whole stack is tried there: the ARM compiler, newlib
# and ST-LINK's tools of EPEL 9, the base's gdb, these two and `silik dev try`. The CI's ISO takes the packages from
# that release (workflow CI). Each build also makes its source package (tools/build_dev.sh: build/srpm/), kept in the
# same release; a package a newer build replaces moves to the release sources-archive with its source
# (tools/release_keep.sh). Runs when a recipe changes, or by hand.
# ARM (aarch64): the recipes that list aarch64 in ExclusiveArch are built the same way on GitHub's ARM runners
# (ubuntu-24.04-arm, the almalinux:9 image's arm64 build), tried there, and kept in the same release beside the
# x86_64 ones (jobs build-arm, trial-arm). (Written 12/11/2026 after the same builds and trials under emulation;
# not run on GitHub yet: docs/STATUS.md)
name: Dev tools
on:
  push:
    branches: [main]
    paths: ['dev/**', 'tools/build_dev.sh', 'tools/release_keep.sh', '.github/workflows/dev.yml', 'eda/common.inc', 'packages/silik-dev/**']
  workflow_dispatch:
# read-only by default (the builds run upstream's build code); only the job that keeps the tried packages writes
permissions:
  contents: read
concurrency:
  group: dev-tools-release
  cancel-in-progress: false
jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        tool: [openocd, dfu-util, stm32flash, silik-pylab, savvycan, sigrok, sdcc]
    runs-on: ubuntu-24.04
    container: almalinux:9
    timeout-minutes: 60
    steps:
      - name: Tools
        run: dnf -y -q install git tar gzip findutils
      - uses: actions/checkout@v4
        with: { persist-credentials: false }
      - name: Build ${{ matrix.tool }}
        shell: bash
        run: |
          if ! bash tools/build_dev.sh ${{ matrix.tool }} > build.log 2>&1; then
            tail -80 build.log
            echo "::error title=build ${{ matrix.tool }}::$(grep -iE 'error|no such file|not found|cannot|undefined|unpackaged|No match' build.log | tail -10 | tr '\n' ' ' | cut -c1-900)"
            exit 1
          fi
          tail -5 build.log
      - name: What was built
        run: echo "::notice title=${{ matrix.tool }} built::$(cd build/extra && ls -la ${{ matrix.tool }}-*.rpm | awk '{print $5, $9}')"
      - uses: actions/upload-artifact@v4
        with:
          name: dev-${{ matrix.tool }}
          path: build/extra/${{ matrix.tool }}-*.rpm
          compression-level: 0
      - uses: actions/upload-artifact@v4
        with:
          name: srpm-dev-${{ matrix.tool }}
          path: build/srpm/${{ matrix.tool }}-[0-9]*.src.rpm
          compression-level: 0

  # the tools built with packages of ours ("# uses:" in the recipe): after those, with the ones of this run (the
  # release's when one was not made). fx2lafw's firmware is compiled with our SDCC
  build-uses:
    needs: build
    strategy:
      fail-fast: false
      matrix:
        tool: [sigrok-firmware-fx2lafw]
    runs-on: ubuntu-24.04
    container: almalinux:9
    timeout-minutes: 30
    steps:
      - name: Tools
        run: dnf -y -q install git tar gzip findutils
      - uses: actions/checkout@v4
        with: { persist-credentials: false }
      - uses: actions/download-artifact@v4      # (the SDCC of this run: build_dev.sh takes no other)
        with: { name: dev-sdcc, path: build/deps }
      - name: Build ${{ matrix.tool }}
        shell: bash
        run: |
          if ! bash tools/build_dev.sh ${{ matrix.tool }} > build.log 2>&1; then
            tail -80 build.log
            echo "::error title=build ${{ matrix.tool }}::$(grep -iE 'error|no such file|not found|cannot|undefined|unpackaged|No match' build.log | tail -10 | tr '\n' ' ' | cut -c1-900)"
            exit 1
          fi
          tail -5 build.log
      - name: What was built
        run: echo "::notice title=${{ matrix.tool }} built::$(cd build/extra && ls -la ${{ matrix.tool }}-*.rpm | awk '{print $5, $9}')"
      - uses: actions/upload-artifact@v4
        with:
          name: dev-${{ matrix.tool }}
          path: build/extra/${{ matrix.tool }}-*.rpm
          compression-level: 0
      - uses: actions/upload-artifact@v4
        with:
          name: srpm-dev-${{ matrix.tool }}
          path: build/srpm/${{ matrix.tool }}-[0-9]*.src.rpm
          compression-level: 0

  trial:
    needs: [build, build-uses]
    permissions:
      contents: write        # (keeps the tried packages in the release)
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
        with: { persist-credentials: false }
      - uses: actions/download-artifact@v4
        with:
          pattern: dev-*
          path: dist
          merge-multiple: true
      - name: Our own packages (silik, the job files)
        run: |
          # (built in an EL 9 container: nothing of the runner's own package servers is needed)
          docker run --rm -v "$PWD:/src" -w /src almalinux:9 bash -c 'dnf -y -q install rpm-build createrepo_c > /dev/null && bash tools/build_rpms.sh'
          cp build/repo/silik-tools-*.rpm build/repo/silik-dev-*.rpm dist/
          ls -la dist
      - name: Try each tool, then the whole stack, in a clean EL 9
        run: |
          rc=0
          for t in openocd dfu-util stm32flash silik-pylab savvycan sigrok sdcc sigrok-firmware-fx2lafw stack; do
            case $t in
              stack) pk='/dist/*.rpm' ;;
              sigrok-firmware-fx2lafw) pk="/dist/$t-[0-9]*.rpm /dist/sigrok-[0-9]*.rpm" ;;   # (libsigrok must find it)
              *) pk="/dist/$t-[0-9]*.rpm" ;;
            esac
            if out=$(docker run --rm -v "$PWD/dist:/dist:ro" -v "$PWD/dev:/dev-recipes:ro" almalinux:9 bash -c "bash /dev-recipes/trial.sh $t $pk" 2>&1); then
              echo "$out" | tail -12
              echo "::notice title=$t on EL 9::$(echo "$out" | grep '^TRIAL-OK' | cut -c10-400)"
            else
              echo "$out" | tail -60
              echo "::error title=trial $t::$(echo "$out" | tail -12 | tr '\n' ' ' | cut -c1-900)"
              rc=1
            fi
          done
          exit $rc
      - uses: actions/download-artifact@v4      # (the source packages: kept beside the binaries, not tried)
        with:
          pattern: srpm-dev-*
          path: src
          merge-multiple: true
      - name: Keep the packages in the release dev-tools, with their source packages
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view dev-tools --repo "$GITHUB_REPOSITORY" > /dev/null 2>&1 || gh release create dev-tools --repo "$GITHUB_REPOSITORY" \
            --title "Embedded-development tools for SilikOS (EL 9)" --prerelease \
            --notes "Tools of the bench built from upstream's unmodified sources on EL 9 (dev/*.spec, dev/versions): OpenOCD, dfu-util, stm32flash, SavvyCAN, sigrok (sigrok-cli, PulseView, the protocol decoders) with the fx2lafw firmware of FX2 logic analysers, SDCC (the compiler it is built with), and silik-pylab (python-can, cantools, esptool, pymodbus from PyPI's source archives, pinned by sha256). None is in EL 9's repositories or EPEL 9. Each keeps its own licence, in the package. Not products of or supported by their authors' projects."
          # (the new one first: never a gap; an older build of the same package moves to sources-archive)
          for t in openocd dfu-util stm32flash silik-pylab savvycan sigrok sdcc sigrok-firmware-fx2lafw; do
            ls src/$t-[0-9]*.src.rpm > /dev/null || { echo "::error title=keep $t::no source package"; exit 1; }
            bash tools/release_keep.sh dev-tools dist/$t-[0-9]*.rpm src/$t-[0-9]*.src.rpm
          done

  # ARM: the recipes whose ExclusiveArch lists aarch64 (built and tried under emulation here first: docs/STATUS.md)
  build-arm:
    strategy:
      fail-fast: false
      matrix:
        tool: [openocd, dfu-util, stm32flash]
    runs-on: ubuntu-24.04-arm
    container: almalinux:9
    timeout-minutes: 60
    steps:
      - name: Tools
        run: dnf -y -q install git tar gzip findutils
      - uses: actions/checkout@v4
        with: { persist-credentials: false }
      - name: Build ${{ matrix.tool }} (aarch64)
        shell: bash
        run: |
          uname -m
          if ! bash tools/build_dev.sh ${{ matrix.tool }} > build.log 2>&1; then
            tail -80 build.log
            echo "::error title=build ${{ matrix.tool }} aarch64::$(grep -iE 'error|no such file|not found|cannot|undefined|unpackaged|No match' build.log | tail -10 | tr '\n' ' ' | cut -c1-900)"
            exit 1
          fi
          tail -5 build.log
      - uses: actions/upload-artifact@v4
        with:
          name: devarm-${{ matrix.tool }}
          path: build/extra/${{ matrix.tool }}-*.rpm
          compression-level: 0
      - uses: actions/upload-artifact@v4
        with:
          name: srpm-devarm-${{ matrix.tool }}
          path: build/srpm/${{ matrix.tool }}-*.src.rpm
          compression-level: 0

  trial-arm:
    needs: build-arm
    permissions:
      contents: write        # (keeps the tried packages in the release)
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
        with: { persist-credentials: false }
      - uses: actions/download-artifact@v4
        with:
          pattern: devarm-*
          path: dist
          merge-multiple: true
      - uses: actions/download-artifact@v4
        with:
          pattern: srpm-devarm-*
          path: src
          merge-multiple: true
      - name: Our own packages (silik, the job files)
        run: |
          docker run --rm -v "$PWD:/src" -w /src almalinux:9 bash -c 'dnf -y -q install rpm-build createrepo_c > /dev/null && bash tools/build_rpms.sh'
          cp build/repo/silik-tools-*.rpm build/repo/silik-dev-*.rpm dist/
          ls -la dist
      - name: Try each tool, then the stack (EPEL's ARM compiler, newlib, stlink; the base's gdb), in a clean EL 9 aarch64
        run: |
          rc=0
          for t in openocd dfu-util stm32flash stack; do
            case $t in stack) pk='/dist/*.rpm' ;; *) pk="/dist/$t-[0-9]*.rpm" ;; esac
            if out=$(docker run --rm -v "$PWD/dist:/dist:ro" -v "$PWD/dev:/dev-recipes:ro" almalinux:9 bash -c "uname -m; bash /dev-recipes/trial.sh $t $pk" 2>&1); then
              echo "$out" | tail -12
              echo "::notice title=$t on EL 9 aarch64::$(echo "$out" | grep '^TRIAL-OK' | cut -c10-400)"
            else
              echo "$out" | tail -60
              echo "::error title=trial $t aarch64::$(echo "$out" | tail -12 | tr '\n' ' ' | cut -c1-900)"
              rc=1
            fi
          done
          exit $rc
      - name: Keep the aarch64 packages in the release dev-tools (beside the x86_64 ones)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view dev-tools --repo "$GITHUB_REPOSITORY" > /dev/null 2>&1 || { echo "::error title=dev-tools::no release yet: the x86_64 jobs make it"; exit 1; }
          # what an aarch64 package replaces (the older aarch64 build of the same package) moves to the release
          # sources-archive; the x86_64 one stays (tools/release_keep.sh tells the architectures apart)
          bash tools/release_keep.sh dev-tools dist/*.aarch64.rpm
          # the source package: one recipe and one source for both architectures, under one file name. The x86_64
          # job's stays when it is there; this build's goes up only when the release has none of that name
          for f in src/*.src.rpm; do
            gh release view dev-tools --repo "$GITHUB_REPOSITORY" --json assets -q '.assets[].name' | grep -qxF "$(basename "$f")" || bash tools/release_keep.sh dev-tools "$f"
          done
