# SilikOS: Qt 5 programs (KLayout, SavvyCAN, PulseView) in the SilikOS look. Qt 5's own GTK platform theme takes the
# desktop's font, icons and file dialogs but none of its colours (Fusion's grey and blue stay, seen 12/11/2026); qt5ct
# gives them the accent's palette (/usr/share/silikos/qt/<accent>.conf, from ~/.config/qt5ct/qt5ct.conf, which qt5ct
# makes from /etc/xdg/qt5ct/qt5ct.conf and `silik look --accent` sets) and keeps GTK's file dialogs. Qt 6 programs
# (Qucs-S) have no qt5ct: they go on to Qt 6's GTK platform theme, which reads the GTK theme's colours itself.
QT_QPA_PLATFORMTHEME=qt5ct
