# SilikOS: the shell's own stylesheet is the SilikOS one wherever the shell draws, also where extensions are off: the
# lock screen and the login screen (seen on the installed system, 10/11/2026: locking brought back the base's panel
# with "Activities" and its logo). GLib reads these files instead of the ones inside the shell's resource bundle;
# nothing of the shell is changed, and when a file is missing the bundle's own is used.
G_RESOURCE_OVERLAYS=/org/gnome/shell/theme/gnome-shell.css=/usr/share/themes/SilikOS/gnome-shell/gnome-shell.css:/org/gnome/shell/theme/toggle-on.svg=/usr/share/themes/SilikOS/gnome-shell/toggle-on.svg:/org/gnome/shell/theme/checkbox.svg=/usr/share/themes/SilikOS/gnome-shell/checkbox.svg:/org/gnome/shell/theme/toggle-off.svg=/usr/share/themes/SilikOS/gnome-shell/toggle-off.svg:/org/gnome/shell/theme/checkbox-off.svg=/usr/share/themes/SilikOS/gnome-shell/checkbox-off.svg
