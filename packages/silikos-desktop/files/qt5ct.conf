; SilikOS (silikos-desktop): Qt 5 programs in the SilikOS look. qt5ct copies this file to ~/.config/qt5ct/ the first
; time a Qt 5 program of a user starts; `silik look --accent` sets color_scheme_path and icon_theme there. The palette
; is the accent's (/usr/share/silikos/qt/<accent>.conf), the file dialogs are GTK's, the font is the desktop's.
[Appearance]
style=Fusion
custom_palette=true
color_scheme_path=/usr/share/silikos/qt/ink.conf
icon_theme=SilikOS
standard_dialogs=gtk3

[Fonts]
general="Cascadia Mono,10,-1,5,50,0,0,0,0,0"
fixed="Cascadia Mono,11,-1,5,50,0,0,0,0,0"
