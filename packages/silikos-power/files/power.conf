# silik power auto: the power profile on mains power and on battery: performance | balanced | saver
# (`silik power auto --ac P --battery P` changes these two lines and applies them at once)
ac = performance
battery = balanced
# silik power charge N adds `charge_limit = N`: the percent the battery charges to, written again at each start
# silik power profiles silikos | base adds `profiles = ...`: whose tuned profile is behind `saver`
