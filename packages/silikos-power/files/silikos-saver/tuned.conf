#
# SilikOS saver: the base's powersave profile and what it leaves out on a laptop (docs/POWER.md)
#
# powersave (tuned 2.27, EL 9.8) already sets: governor schedutil | conservative | powersave, energy preference
# power, boost off, platform profile low-power | quiet, the sound card asleep after 10 s, SATA link power
# med_power_with_dipm, the panel's power saving 3, vm.laptop_mode 5, writeback every 15 s, no NMI watchdog.
# Its own script does nothing more on EL 9: USB autosuspend only with USB_AUTOSUSPEND=1 in tuned's environment, and
# Wi-Fi power save through iwpriv, which no package of BaseOS, AppStream or EPEL 9 has. This profile includes it
# unchanged and adds, in script.sh: runtime power management of the PCI devices, USB autosuspend, Wi-Fi power save
# through iw.
#
# `silik power profiles silikos` puts it behind `silik power saver` (and the system menu's Power Saver);
# `silik power profiles base` puts the base's powersave back.

[main]
summary=SilikOS saver: powersave, and PCI runtime power management, USB autosuspend, Wi-Fi power save
include=powersave

[script]
script=${i:PROFILE_DIR}/script.sh
