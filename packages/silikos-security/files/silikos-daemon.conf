# SilikOS: the configuration the USBGuard daemon runs with (package silikos-security; docs/USB.md).
# usbguard.service reads THIS file, not usbguard-daemon.conf beside it, which stays the base package's own, as
# shipped: /usr/lib/systemd/system/usbguard.service.d/10-silikos.conf says so. `silik usb` shows what is in effect.
#
# What it is for: a device plugged in while the screen is locked is not accepted. The desktop does the switching
# (GNOME's USB protection, level "lockscreen"): it sets InsertedDevicePolicy to block when the screen locks and
# back to apply-policy when it is unlocked. Everything else here is chosen so that nobody is locked out:
# a keyboard that is plugged in when the machine starts, or at the login screen, or while unlocked, works.
#
# Mode 0600, owner root: the daemon does not start with a configuration others can read.

# The base's own rule file (empty as shipped; root's own rules go here: it is read first) and rule folder.
RuleFile=/etc/usbguard/rules.conf
RuleFolder=/etc/usbguard/rules.d/

# A device no rule names is accepted (the base's file says block). The protection is the lock, not a list of
# known devices: with block, a new keyboard at the login screen, where no desktop session runs to accept it,
# would be dead. `silik usb level always` is the stricter choice.
ImplicitPolicyTarget=allow

# What is plugged in when the daemon starts is accepted (the base's file says apply-policy): whatever the rules
# say, a restart with the keyboard plugged in gives the keyboard back. The cost: a device that is there when the
# machine starts is trusted.
PresentDevicePolicy=allow
PresentControllerPolicy=keep

# A device plugged in later: by the rules, which accept it. The desktop changes this value to block while the
# screen is locked (it is not written back to this file: a restart of the daemon starts from apply-policy).
InsertedDevicePolicy=apply-policy

# When the daemon is stopped, the USB controllers accept new devices again by themselves (the base's file says
# false: they would keep refusing every new device until the next start of the machine, a keyboard included).
# The cost, as the base's file says it: whoever can make the daemon stop turns the protection off. Stopping it
# takes root.
RestoreControllerDeviceState=true

DeviceManagerBackend=uevent

# Who may ask the daemon directly (the `usbguard` command, `silik usb allow`): root alone. The base's own file also
# lets the group wheel in without a password; here an administrator's `silik usb allow` goes through sudo, so that
# a program that merely runs as the owner cannot switch the policy or add a rule behind their back (the second pass
# of 14/11/2026). The desktop goes through usbguard-dbus and polkit instead (70-silikos-usbguard.rules).
IPCAllowedUsers=root
IPCAllowedGroups=
IPCAccessControlFiles=/etc/usbguard/IPCAccessControl.d/

DeviceRulesWithPort=false

# What was accepted and refused, and when: readable by root.
AuditBackend=FileAudit
AuditFilePath=/var/log/usbguard/usbguard-audit.log
