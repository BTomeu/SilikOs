# SilikOS — automatic updates of everything (package silikos-security): the configuration that silikos-update.service
# gives to dnf-automatic. Every update of the system's repositories (the base's, EPEL's, SilikOS's when it has its
# own), not only the security ones. The base's own /etc/dnf/automatic.conf is not used and not changed.
# `silik update --auto all | security | off` chooses between this, the security-only timer and none.

[commands]
upgrade_type = default
download_updates = yes
apply_updates = yes
# never restart the machine by itself: the status bar says "restart" when a new kernel or a core library waits
reboot = never
random_sleep = 0
network_online_timeout = 60

[emitters]
# what was installed goes to the journal: journalctl -u silikos-update
emit_via = stdio

[base]
debuglevel = 1
