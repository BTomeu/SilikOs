# SilikOS — the snapshots of / made before an update (package silikos-security; `silik snapshot`, `silik rollback`;
# docs/ROLLBACK.md). Every value here is a PROPOSAL: none was measured on a machine yet.

# the snapshots made before updates that are kept: the newest `keep`, and none older than `days` days
# (the newest is always kept; a snapshot made by hand with `silik snapshot create` is kept until it is deleted)
keep = 5
days = 14

# no new snapshot while the thin pool is this full, in percent of its data and of its metadata: the old snapshots are
# pruned first, then the update goes on without one and the status bar says "update: no snapshot".
# (the pool grows by itself at 70 %: /etc/lvm/profile/silikos-thin.profile)
pool_data_max = 70
pool_meta_max = 50

# what snapm asks of the pool before a snapshot. Its own default, 200%USED, wants free space for twice what / holds:
# a pool half full never has it; 100%FREE is refused by snapm's own rounding. A thin snapshot takes no space when it
# is made: half of what is free is always there, and the two limits above are what guards the pool.
size_policy = 50%FREE
