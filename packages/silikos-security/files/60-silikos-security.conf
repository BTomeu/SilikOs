# SilikOS — kernel settings on top of the base's (package silikos-security).
# The base (EL 9.8: /usr/lib/sysctl.d/50-default.conf, 50-redhat.conf) already sets kernel.kptr_restrict = 1,
# fs.protected_hardlinks / symlinks / fifos / regular = 1, strict reverse-path filtering and no source routing; they
# are not repeated here. `silik secure status` reads all of them. To change one, put a file with a later name in
# /etc/sysctl.d (for example /etc/sysctl.d/90-local.conf): this file is replaced on updates.
# Not touched, because something here needs them: user.max_user_namespaces (podman rootless, bubblewrap),
# vm.mmap_min_addr (Wine), kernel.kexec_load_disabled (kdump), net.ipv4.ip_forward (libvirt and podman set it).

# The kernel log (addresses, hardware and driver details) is for root: `sudo dmesg`, `journalctl -k`.
kernel.dmesg_restrict = 1

# A process may trace (ptrace, /proc/PID/mem) only its own descendants; root (sudo gdb -p PID) may trace anything.
# Without it any program of the user (a Windows .exe under Wine, a browser tab that got out) reads the memory of every
# other one: keys in ssh-agent, the keyring, an open design. The base sets 0 (10-default-yama-scope.conf).
# Still works: gdb / strace starting a program, debuggers inside a tool that start what they debug, podman rootless.
# Stops working without sudo: `gdb -p PID` and `strace -p PID` on a process that is not a child.
# [A] Wine: it asks the kernel to let its own processes trace each other (prctl PR_SET_PTRACER), written for
#     Ubuntu, where 1 has been the default since 2010. Not run here.
# [A] EDA tools: a crash handler that attaches a debugger to its own parent to print a stack trace gets no trace
#     (the tool runs the same). Not run here: if a tool needs it, set 0 in /etc/sysctl.d/90-local.conf.
kernel.yama.ptrace_scope = 1

# ICMP redirects: a machine on the same network (a cafe, a conference) can ask this one to send its traffic through
# it. A workstation with one gateway needs none; the gateway comes from DHCP / router advertisements.
net.ipv4.conf.default.accept_redirects = 0
net.ipv4.conf.*.accept_redirects = 0
net.ipv6.conf.default.accept_redirects = 0
net.ipv6.conf.*.accept_redirects = 0

# This machine is not a router: when forwarding is turned on for a virtual machine network, it does not tell the
# hosts of the outside network to route through it.
net.ipv4.conf.default.send_redirects = 0
net.ipv4.conf.*.send_redirects = 0

# ---- added by the audit of 13/11/2026 (docs/SECURITY.md). Read on EL 9.8's kernel 5.14.0-687 started in an emulator:
# each key exists there, and what the base leaves it at is said. None of them was seen to break a tool [A]: to put
# one back, a file with a later name in /etc/sysctl.d.

# The same redirect keys once more under their literal names: the kernel takes the patterns above, but what checks
# a system against a baseline (the base's own OpenSCAP content) reads only these. And "secure" redirects (from a
# machine that claims to be a gateway) are redirects too.
net.ipv4.conf.all.accept_redirects = 0
net.ipv6.conf.all.accept_redirects = 0
net.ipv4.conf.all.send_redirects = 0
net.ipv4.conf.all.secure_redirects = 0
net.ipv4.conf.default.secure_redirects = 0
net.ipv4.conf.all.accept_source_route = 0
net.ipv4.conf.default.accept_source_route = 0

# In a folder everyone may write (/tmp), a program does not open a file or a pipe that someone else left there under
# the name it expects, even where the folder is also the group's (the base has 1: only folders that are everyone's).
fs.protected_fifos = 2
fs.protected_regular = 2

# A program that changed user when it started (sudo, su, a setuid helper) leaves no memory image when it crashes:
# what it held is another user's. The base has 2 (kept, for root); ordinary programs still leave theirs.
fs.suid_dumpable = 0

# A serial line discipline (the kernel's handlers for modems, SLIP, CAN over serial) is loaded when root asks for
# it, not when any program sets one on a terminal: several of them had faults a user could reach. `slcand` and
# `hciattach` run as root and are not affected.
dev.tty.ldisc_autoload = 0
