# SilikOS — automatic security updates (package silikos-security): the configuration that
# silikos-security-update.service gives to dnf-automatic. The base's own /etc/dnf/automatic.conf is not used and not
# changed. Options: man dnf-automatic.

[commands]
# only packages named by a security advisory of the base's repositories (and EPEL's)
upgrade_type = security
download_updates = yes
apply_updates = yes
# never restart the machine: a new kernel is used from the next boot (`silik secure status` says when updates wait)
reboot = never
random_sleep = 0
network_online_timeout = 60

[emitters]
# what was installed goes to the journal: journalctl -u silikos-security-update
emit_via = stdio

[base]
# ten packages downloaded at a time instead of dnf's three (measured in a clean EL 9, 12/11/2026: 204 MB in 162
# packages, 6 pairs of runs, ten as fast or faster in each, median 15.6 s -> 11.9 s); only for these updates: the
# base's /etc/dnf/dnf.conf is not changed
max_parallel_downloads = 10
debuglevel = 1
