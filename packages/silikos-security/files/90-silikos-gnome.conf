# SilikOS (package silikos-security; docs/USB.md). The rule GNOME's USB protection looks for: gsd-usb-protection
# reads the rules and, when this exact one is not among them, tries to add it itself, which USBGuard 1.1.4 refuses
# ("Invalid parent ID") and which would need the right to change the rules. With it here the desktop adds nothing.
# It accepts every device: what refuses a device while the screen is locked is InsertedDevicePolicy, which the desktop
# switches. Root's own rules go in /etc/usbguard/rules.conf, which is read before this file.
allow id *:* label "GNOME_SETTINGS_DAEMON_RULE"
