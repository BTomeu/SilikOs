# SilikOS (package silikos-security; docs/USB.md): the USBGuard daemon of the base, with SilikOS's configuration.
# The base's unit starts it with -c /etc/usbguard/usbguard-daemon.conf; here the same command (usbguard 1.1.4-2.el9:
# -f fork, -s log to syslog, -K nothing on the console) reads /etc/usbguard/silikos-daemon.conf. The base's file is
# not edited. To go back to it: an empty ExecStart= line and the base's own in /etc/systemd/system/usbguard.service.d/.
[Service]
ExecStart=
ExecStart=/usr/sbin/usbguard-daemon -f -s -K -c /etc/usbguard/silikos-daemon.conf
