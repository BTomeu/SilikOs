# SilikOS — NetworkManager defaults for privacy (package silikos-security; the audit of 13/11/2026). A connection's
# own setting wins; a file with a later name in /etc/NetworkManager/conf.d changes it for all.
# IPv6: outgoing connections use a temporary address that changes, not the stable one that names this machine to
# every site it visits (RFC 4941; the base leaves it off). The stable address stays, for what connects to this machine.
[connection]
ipv6.ip6-privacy=2
