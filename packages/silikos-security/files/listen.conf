# SilikOS: the network services of the base that stay on (docs/SECURITY.md, `silik listen`).
# On SilikOS the port mapper of NFS v3 (nfs), mDNS (mdns) and the discovery of network printers (printers) are off,
# and `silik secure apply` turns them off again. One that is named here is left on: `silik listen on NAME` writes
# the line and turns it on, `silik listen off NAME` takes it out and turns it off.
