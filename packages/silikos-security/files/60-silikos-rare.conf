# SilikOS — network protocols a workstation does not use are not loaded because a program asked for a socket of
# that kind (package silikos-security; the audit of 13/11/2026). Each exists as a module in EL 9.8's kernel packages
# and is loaded on demand; the base already keeps out sctp, atm and l2tp the same way. CAN, Bluetooth, PPP and the
# rest of what a bench or a laptop uses are not here. To use one: `sudo modprobe --ignore-install NAME`, or a file
# with a later name in /etc/modprobe.d.
install tipc /bin/false
install ieee802154_socket /bin/false
install mpls_router /bin/false
