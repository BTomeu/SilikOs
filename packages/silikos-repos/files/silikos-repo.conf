# silikos-repo: the dnf plugin of the package silikos-repos (docs/SIGNING.md). It refuses metadata of SilikOS's own
# repository that are older than the ones this system has already seen (an old repository served again) or that are
# another channel's, and says when a repository's newest metadata are old. The highest revision seen of each
# repository: /var/lib/silikos/repo-revision. One run without it: dnf --disableplugin=silikos-repo ...
[main]
enabled = 1
# days after which metadata that the server has just given are said to be old (0: never said).
# SilikOS's own channels: the metadata are published again at least twice a month [PROPOSAL: 45 = three missed]
warn_days = 45
# the base's repositories below: only ever a warning, nothing of them is refused [A: they change more often than this]
base_warn_days = 45
watch = baseos appstream
