# SilikOS: what the vendors' tools ask of the system (`silik vendor list | check | prepare | lib`). DATA ONLY: nothing
# here is executed. `silik vendor` reads the keys below; the only words of this file that reach a command line are
# package names (handed to rpm and dnf) and the names of the fixed checks `silik` itself knows.
#
# NOTHING IN THIS FILE HAS BEEN TRIED WITH A VENDOR'S INSTALLER. Each stanza says what a published page says, and how
# it was read:
#   read = page      the vendor's own text was opened and read (its documentation's source or its own repository)
#   read = extract   the vendor's page could not be opened from the build machine (its host was not reachable): what
#                    is written is the search engine's extract of that page. [A]: confirm on the page (url)
#   read = none      not confirmed at all [A]
# date: the day it was read. url: where. more: the other sources of the stanza.
#
# el9: what the vendor says of EL 9 for that release
#   yes       AlmaLinux 9 is named            rhel      RHEL 9 is named, AlmaLinux is not
#   unlisted  a Linux version exists, no EL 9 system is named (Ubuntu, Fedora, CentOS 7 / 8...)
#   kernel    the driver is in EL 9's kernel  box       an older EL: a box (silik eda create)
#   windows   Windows only: the Windows virtual machine (docs/WINDOWS.md)        unknown   not confirmed [A]
# minors: the EL 9 minor versions the vendor names (empty: none named, or any 9.x)
# pkgs: EL 9 package names for what the source read asks (a name that does not resolve in EL 9 + CRB + EPEL is a bug:
#   tools/check_deps.sh, tests/vendor_names_el9.tsv). pkgs_a: names NOT from the vendor's page [A] (user reports,
#   the package that holds a library the tool is reported to load). A name may carry an architecture (glibc.i686).
# repos: the repositories those packages need enabled.    minver: PACKAGE:VERSION the source gives as a minimum.
# checks: the fixed checks of `silik vendor check` that apply (base identity lsb hostid tmp locale x11 selinux
#   limits kernel serial kvm box usbtmc canmod).    udev: the vendor's own device-rule files (glob), looked for,
#   never copied; udev_how: what installs them.    own: the vendor's own check, to run after its installer.
# route: on SilikOS, for what does not install on EL 9 itself.    A value continues on lines that start with a space.

[flexlm]
name = FlexNet licence daemons (lmgrd and a vendor daemon)
maker = Revenera (shipped by each tool vendor)
kind = licence
el9 = rhel
release = FlexNet Publisher 11.19
says = RHEL 9 has no LSB component and lmgrd needs the LSB loader: without it lmgrd fails with "No such file or directory"; the published workaround is a link to the glibc loader
read = extract
date = 2026-11-13
url = https://community.revenera.com/s/article/workaround-for-lsb-component-in-rhel
more = https://community.flexera.com/t5/FlexNet-Publisher-Forum/FNP-on-RHEL-9/m-p/248927 https://www.keil.com/support/docs/4044.htm
checks = lsb hostid tmp selinux
note = redhat-lsb-core does not exist in EL 9 (checked in its repositories, 13/11/2026); EPEL 9's lsb_release is only the command some installers call. [A] lmgrd keeps its lock files under /usr/tmp/.flexlm

